<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardiology Clinical Pro 2026 – V27</title>
<meta name="author" content="ThS. BS. Thái Trần Phúc Thiện">
<meta name="description" content="Hỗ trợ lựa chọn phác đồ tim mạch tương tác theo ESC và AHA/ACC — học tập và tham khảo lâm sàng">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE   công cụ lâm sàng: chính xác, gọn, đọc nhanh dưới áp lực
   IDEA    tờ điện tâm đồ và bảng theo dõi tại giường: lưới mảnh, nét vẽ ECG, nhãn màu theo mức độ
   PICTURE dải đầu trang có đường ECG chạy; bảng "tình trạng BN" vẽ kết quả màu theo điều kiện
   COLOUR  nền trắng / đêm #0f1316; mực #14161a; đỏ tim #c8102e chỉ cho cấp cứu; cam, xanh dương, xanh lá, xám theo quy ước đề bài
   TYPE    Be Vietnam Pro (dấu tiếng Việt chuẩn) cho mọi chữ, tabular-nums cho số
   LAYOUT  laptop: danh mục trái 260px | nội dung | bảng thuốc/cảnh báo phải 340px; <900px: ngăn kéo trái/phải; điện thoại: một cột */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1316);--bg2:light-dark(#f4f6f7,#161c20);--bg3:light-dark(#e9edef,#1e262b);
--ink:light-dark(#14161a,#e8ecee);--ink2:light-dark(#4a5258,#a9b3b9);--line:light-dark(#d9dee1,#2a3339);
--brand:light-dark(#0b4f6c,#6fb6d6);--grid:light-dark(#f6d7dc,#3a2026);
--red:light-dark(#c8102e,#ff5a6e);--redb:light-dark(#fde8eb,#3a1a20);
--org:light-dark(#c25e00,#ffa04d);--orgb:light-dark(#fff1e3,#3a2814);
--blu:light-dark(#1f5fbf,#79a8ff);--blub:light-dark(#e8f0fc,#17233a);
--grn:light-dark(#1d7a3a,#5fd38a);--grnb:light-dark(#e6f5ea,#142b1c);
--gry:light-dark(#6b7378,#8d979d);--gryb:light-dark(#f0f2f3,#1d2327);
--on:light-dark(#ffffff,#0b1114);--r:10px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.01em;margin:0}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
/* Header */
.hd{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg);overflow:hidden}
.hd::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px;opacity:.55;pointer-events:none}
.hd>*{position:relative}
.ecg{position:absolute;right:0;top:0;height:100%;width:min(46%,520px);pointer-events:none;opacity:.9}
.ecg path{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:beat 3.2s linear infinite}
@keyframes beat{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.logo b{color:var(--red)}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.logo .lt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo .ln{font-weight:800}
.logo .la{display:block;margin-top:2px;font-size:12.5px;font-weight:700;color:var(--brand);letter-spacing:.01em;white-space:normal}
.srch{flex:1 1 260px;max-width:560px;position:relative}
.srch input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px 0 40px;font-size:16px;background:var(--bg)}
.srch input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.srch svg{position:absolute;left:13px;top:12px;width:18px;height:18px;stroke:var(--ink2)}
.sres{position:absolute;z-index:50;top:46px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgb(0 0 0/.18);max-height:60vh;overflow:auto;display:none}
.sres.on{display:block}
.sres .g{font-size:12px;color:var(--ink2);padding:8px 12px 2px;font-weight:600}
.sres button{display:flex;gap:8px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.sres button:hover,.sres button.act{background:var(--bg3)}
.sres button span{color:var(--ink2);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:0 12px;height:36px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.gsel button.on[data-g=esc]{background:var(--brand);color:var(--on)}
.seg.gsel button.on[data-g=aha]{background:var(--red);color:var(--on)}
.ib{height:36px;min-width:36px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{border-color:var(--ink2)}
.ib:focus-visible,.seg button:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.menu{display:none}
/* Body */
.bd{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;min-height:0}
.nav,.main,.side{overflow:auto;min-height:0}
.nav{border-right:1px solid var(--line);background:var(--bg2);padding:10px 8px 40px}
.nav h5{margin:14px 8px 4px;font-size:12px;color:var(--ink2);font-weight:700}
.nav button{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover{background:var(--bg3)}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav .n{width:20px;color:var(--ink2);font-size:12px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.nav button.on .n{color:inherit}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.red{background:var(--red)}.dot.orange{background:var(--org)}.dot.blue{background:var(--blu)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px}
.tools button{flex-direction:column;align-items:flex-start;gap:0;background:var(--bg);border:1px solid var(--line);min-height:54px;font-weight:600;font-size:13px}
.tools button small{font-weight:400;color:var(--ink2);font-size:12px}
.main{padding:16px clamp(12px,2.4vw,28px) 80px}
.side{border-left:1px solid var(--line);background:var(--bg2);padding:12px 12px 60px}
/* Content */
.ttl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:10px}
.ttl h2{font-size:clamp(24px,3vw,34px);font-weight:800}
.ttl .en{color:var(--ink2);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.chip.sm{padding:3px 10px;min-height:30px;font-weight:500}
.tabs{display:grid;gap:8px;margin:12px 0 10px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);scroll-margin-top:8px}
.tg{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:start}
.tgl{font-size:12px;font-weight:800;color:var(--ink2);padding-top:9px}
.tgb{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:0 11px;min-height:36px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.tab:hover{border-color:var(--ink2)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.tpt{border-color:var(--grn);color:var(--grn)}
.tab.tpt.on{background:var(--grn);color:var(--on)}
.tab.tem{border-color:var(--red);color:var(--red)}
.tab.tem.on{background:var(--red);color:var(--on)}
.tabh{font-size:19px;font-weight:800;margin:6px 0 8px;scroll-margin-top:8px}
.tnav{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.ct{max-width:980px}
.ct p{margin:6px 0 10px}
.ct ul,.ct ol{margin:6px 0 12px;padding-left:22px}
.ct li{margin:3px 0}
.ct h4{font-size:16px;margin:18px 0 8px;font-weight:700}
.tw{overflow-x:auto;margin:8px 0 14px;border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl caption{caption-side:bottom;text-align:left;font-size:12px;color:var(--ink2);padding:6px 10px}
.tbl th{background:var(--bg3);text-align:left;padding:8px 10px;font-weight:700;font-size:13px;vertical-align:bottom}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td ul{margin:0;padding-left:18px}
.box{border-radius:var(--r);padding:10px 12px;margin:10px 0;border:1px solid;font-size:14px}
.box.red{background:var(--redb);border-color:var(--red)}.box.orange{background:var(--orgb);border-color:var(--org)}.box.blue{background:var(--blub);border-color:var(--blu)}.box.green{background:var(--grnb);border-color:var(--grn)}.box.gray{background:var(--gryb);border-color:var(--gry)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.tag.red{background:var(--red)}.tag.orange{background:var(--org)}.tag.blue{background:var(--blu)}.tag.green{background:var(--grn)}.tag.gray{background:var(--gry)}
.cor{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:4px;margin-left:3px;vertical-align:1px;white-space:nowrap;border:1px solid}
.cor.ci{color:var(--grn);border-color:var(--grn)}.cor.ciia{color:var(--blu);border-color:var(--blu)}.cor.ciib{color:var(--org);border-color:var(--org)}.cor.ciii{color:var(--red);border-color:var(--red)}
.dl,.sl,.il{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;background:none;border:0;padding:0;font-size:inherit}
.il{color:var(--grn)}
/* ESC / AHA */
.glpair{display:grid;gap:10px;margin:10px 0}
.gl{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--bg)}
.gl.esc{border-top:3px solid var(--brand)}.gl.aha{border-top:3px solid var(--red)}
.glh{font-size:12px;font-weight:800;margin-bottom:4px}
.gl.esc .glh{color:var(--brand)}.gl.aha .glh{color:var(--red)}
body.g-esc .gl.aha,body.g-aha .gl.esc{display:none}
body.g-both .glpair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.g-esc .cmp .ca,body.g-aha .cmp .ce{display:none}
/* Algorithm */
.algo{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:12px 0;background:var(--bg2)}
.algo-t{font-weight:800;margin-bottom:8px}
.an{border-radius:8px;padding:8px 12px;border:1.5px solid;font-size:14px;background:var(--bg)}
.an.red{border-color:var(--red)}.an.orange{border-color:var(--org)}.an.blue{border-color:var(--blu)}.an.green{border-color:var(--grn)}.an.gray{border-color:var(--gry)}
.an.q{border-color:var(--ink);padding:0;overflow:hidden}
.aq{background:var(--ink);color:var(--bg);padding:7px 12px;font-weight:700}
.ab{display:grid;grid-template-columns:1fr 1fr}
.ay,.ano{padding:8px 12px;font-size:14px}
.ay{border-right:1px solid var(--line)}
.ay span,.ano span{display:block;font-size:11px;font-weight:800}
.ay span{color:var(--grn)}.ano span{color:var(--red)}
.aa{text-align:center;color:var(--ink2);font-size:12px;line-height:1.4}
/* Patient panel */
.pt{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:16px;align-items:start}
.pf{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg2)}
.pf h4{margin:10px 0 6px;font-size:14px}
.pf h4:first-child{margin-top:0}
.fr{display:grid;grid-template-columns:minmax(0,112px) minmax(0,1fr);gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.fr:last-child{border-bottom:0}
.fr>label{font-size:13px;font-weight:600}
.fr .unset{color:var(--gry);font-style:italic}
.sl2{display:grid;grid-template-columns:30px minmax(70px,1fr) 30px 84px 22px;gap:4px;align-items:center}
.sl2 input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.sl2 .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:13.5px;white-space:nowrap}
.sm-b{height:30px;width:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-weight:700}
.x{height:28px;width:22px;padding:0;border:0;background:none;color:var(--gry);cursor:pointer;font-size:16px}
.opt{display:flex;flex-wrap:wrap;gap:4px}
.opt button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;min-height:32px;cursor:pointer;font-size:13px;font-weight:600}
.opt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{position:sticky;top:44px}
.rc{border-radius:var(--r);border:1px solid var(--line);border-left:6px solid;padding:9px 12px;margin:8px 0;background:var(--bg)}
.rc.red{border-left-color:var(--red);background:var(--redb)}.rc.orange{border-left-color:var(--org);background:var(--orgb)}.rc.blue{border-left-color:var(--blu);background:var(--blub)}.rc.green{border-left-color:var(--grn);background:var(--grnb)}.rc.gray{border-left-color:var(--gry);background:var(--gryb);color:var(--ink2)}
.rc b{display:block}
.rc .why{font-size:12px;color:var(--ink2);margin-top:2px}
.rc .need{font-size:12.5px;color:var(--org);font-weight:700;margin-top:3px}
.mbar{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:6px 0}
.derv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.derv span{background:var(--bg3);padding:3px 8px;border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums}
/* Side panel */
.sp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sp-h h3{font-size:18px;font-weight:800}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 8px;font-size:13.5px}
.kv dt{color:var(--ink2);font-weight:600}
.kv dd{margin:0}
.kv dt.hl,.kv dd.hl{background:var(--blub);padding:2px 4px;border-radius:4px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.badge.meta{color:var(--grn);border-color:var(--grn)}.badge.known{color:var(--org);border-color:var(--org)}
/* Cards & grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg);cursor:pointer;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--ink2)}
.card.red{border-top:4px solid var(--red)}.card.orange{border-top:4px solid var(--org)}.card.blue{border-top:4px solid var(--blu)}
.card h4{font-size:15px;margin:0 0 4px}
.card p{margin:0;font-size:13px;color:var(--ink2)}
.btn{border:0;border-radius:8px;padding:0 14px;height:40px;cursor:pointer;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--bg3);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
/* IV & scores */
.ivg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.fld{display:grid;gap:4px;margin:8px 0}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select{height:42px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:16px;background:var(--bg);width:100%}
.fld input:focus,.fld select:focus{outline:2px solid var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand)}
.big small{font-size:18px;font-weight:600;color:var(--ink2)}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg3);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;white-space:pre-wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--brand)}
.quiz .o{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:14px}
.quiz .o.ok{border-color:var(--grn);background:var(--grnb)}.quiz .o.no{border-color:var(--red);background:var(--redb)}
.mm{padding-left:0;list-style:none}
.mm ul{list-style:none;border-left:2px solid var(--line);margin-left:10px;padding-left:14px}
.mm li{position:relative;margin:4px 0}
.mm>li>span{background:var(--red);color:#fff;padding:4px 10px;border-radius:999px;font-weight:700}
.mm ul>li>span{background:var(--bg3);padding:2px 8px;border-radius:6px;font-weight:600;font-size:13.5px}
.mm ul ul>li>span{background:none;font-weight:400;padding:0}
.note{font-size:12.5px;color:var(--ink2)}
.disc{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);margin-top:24px;padding-top:10px}
.scrim{display:none}
#printArea{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;display:none;max-width:90vw}
/* Emergency mode */
.emh{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-weight:700}
/* Responsive */
@media(max-width:1180px){.bd{grid-template-columns:240px minmax(0,1fr)}.side{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);z-index:60;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgb(0 0 0/.2)}.side.open{transform:none}.scrim.on{display:block;position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:55}.sclose{display:inline-flex}}
@media(min-width:1181px){.sclose{display:none}}
@media(max-width:900px){.bd{grid-template-columns:minmax(0,1fr)}.nav{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 30px rgb(0 0 0/.2)}.nav.open{transform:none}.menu{display:inline-flex}.pt,.ivg{grid-template-columns:minmax(0,1fr)}.res{position:static}.mbar{display:flex;align-items:center;gap:6px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 0;z-index:4}.mbar .btn{margin-left:auto;height:36px}.ecg{opacity:.35}}
