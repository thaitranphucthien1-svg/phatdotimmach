<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điều trị Nội tổng hợp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: lâm sàng, điềm tĩnh, chính xác — công cụ trực ca, không phô diễn.
IDEA: tờ phác đồ treo tại khoa: chọn tình trạng → hiện đúng y lệnh, thuốc, theo dõi.
PICTURE: bảng chip tình trạng + thẻ thuốc là hình ảnh chính; sơ đồ bước bấm được.
COLOUR and TYPE: navy #173B57 điều hướng, xanh ngọc ưu tiên; màu chuyên khoa làm điểm nhấn; Be Vietnam Pro.
LAYOUT: danh mục trái | nội dung giữa | hỗ trợ quyết định phải; xếp chồng trên máy tính bảng/điện thoại.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eef3f6,#0b1620);--card:light-dark(#ffffff,#122230);--card2:light-dark(#f6f9fb,#0f1d29);
--ink:light-dark(#10222f,#e4edf3);--mute:light-dark(#5a6d7b,#93a7b6);--line:light-dark(#dde6ec,#223646);
--nav:#173B57;--nav2:#0f2c43;
--prio:#0D9488;--prio-bg:light-dark(#e3f5f2,#0d2e2c);
--supp:#64748B;--supp-bg:light-dark(#eef2f6,#1b2a37);--mon:#2563EB;--mon-bg:light-dark(#e7efff,#13254a);
--spec:#7C3AED;--spec-bg:light-dark(#f0eaff,#261a45);
--caut:#C26A06;--caut-bg:light-dark(#fff2e0,#3a2610);
--dang:#D02F2F;--dang-bg:light-dark(#fdeaea,#3e1616);
--info:#64748B;--info-bg:light-dark(#eef2f6,#1b2a37);
--acc:#0D9488;--acc2:#5BB98C;--acc-bg:light-dark(#e3f5f2,#0d2e2c);
--sh:0 1px 2px rgba(16,34,47,.06),0 6px 18px rgba(16,34,47,.06);
--r:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sm svg.i,svg.i.sm{width:16px;height:16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--nav);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0D9488,#2b6f9a)}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.75}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;padding:0 14px 0 40px;font-size:16px}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search>svg{position:absolute;left:12px;top:11px;opacity:.8}
.sres{position:absolute;top:48px;left:0;right:0;background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:60vh;overflow:auto;display:none;padding:6px}
.sres.on{display:block}
.sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:9px}
.sres button:hover,.sres button.k{background:var(--card2)}
.sres em{font-style:normal;color:var(--mute);font-size:13px;margin-left:auto;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.16)}
#menuBtn{display:none}

/* ---------- group switch ---------- */
.gbar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:20}
.gpill{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);white-space:nowrap;font-weight:500;transition:.18s}
.gpill i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.gpill.on{background:var(--c);border-color:var(--c);color:#fff}
.gpill.on i{background:#fff}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1680px;margin:0 auto;align-items:start}
.side{position:sticky;top:128px;max-height:calc(100vh - 144px);overflow:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px}
.side h4{margin:14px 8px 6px;font-size:12.5px;color:var(--mute);font-weight:600}
.side h4:first-child{margin-top:4px}
.dl{list-style:none;margin:0;padding:0}
.dl button{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;text-align:left;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:14.5px}
.dl button:hover{background:var(--card2)}
.dl button.on{background:var(--acc-bg);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--acc)}
.dl .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#999);flex:none}
.dl .st{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--info-bg);color:var(--mute);white-space:nowrap}
.dl .st.ok{background:var(--prio-bg);color:var(--prio)}
.gh{display:flex;align-items:center;gap:8px;margin:10px 4px 4px;padding:8px 8px;border-radius:10px;background:var(--card2);font-weight:600;font-size:14px;width:calc(100% - 8px);border:0;text-align:left}
.gh i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.gh svg{margin-left:auto;transition:.2s}
.gh[aria-expanded=false] svg{transform:rotate(-90deg)}
.chipmini{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.chipmini button{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 11px;font-size:13px;min-height:34px}

.main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.hero{position:relative;overflow:hidden;padding:20px 20px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 14%,var(--card)) 0%,var(--card) 62%)}
.hero .gb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--acc);background:var(--acc-bg);padding:4px 10px;border-radius:999px}
.hero h1{margin:8px 0 6px;font-size:clamp(24px,3vw,32px);line-height:1.12;text-wrap:balance}
.hero p{margin:0;color:var(--mute);max-width:75ch}
.hrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.meta{font-size:12.5px;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.ibtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.ibtn:hover{border-color:var(--acc)}
.ibtn.fav.on{color:#c58a00;border-color:#e5b94a;background:light-dark(#fff8e3,#33280c)}
.ibtn.fav.on svg{fill:#e5b94a;stroke:#c58a00}

/* chips */
.sec-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:700}
.sec-t small{font-weight:500;color:var(--mute);font-size:12.5px}
.sec-t .sp{margin-left:auto;display:flex;gap:6px}
.cgrp{margin-bottom:10px}
.cgrp>span{display:block;font-size:12px;color:var(--mute);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-weight:500;font-size:14.5px;transition:transform .12s,background .18s,border-color .18s,box-shadow .18s;text-align:left}
.chip:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.chip:active{transform:scale(.97)}
.chip .bx{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;flex:none}
.chip.rad .bx{border-radius:50%}
.chip.on{background:var(--acc-bg);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
.chip.on .bx{background:var(--acc);border-color:var(--acc)}
.chip.on .bx::after{content:"";width:8px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chip.rad.on .bx::after{width:6px;height:6px;border:0;border-radius:50%;background:#fff;transform:none}
.chip.t-dang.on{background:var(--dang-bg);border-color:var(--dang);--acc:var(--dang)}
.chip.t-caut.on{background:var(--caut-bg);border-color:var(--caut);--acc:var(--caut)}

/* prompts */
.need{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--caut-bg);border:1px solid color-mix(in srgb,var(--caut) 35%,transparent);margin-top:10px}
.need svg{color:var(--caut);margin-top:2px}
.need b{display:block;font-size:14px}
.need p{margin:2px 0 6px;font-size:14px}
.need .chips .chip{min-height:38px;padding:5px 11px;font-size:13.5px;background:var(--card)}

/* quick actions */
.qa{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.qb{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);white-space:nowrap;font-weight:500;font-size:14px;color:var(--ink);transition:.15s}
.qb svg{color:var(--tc,var(--acc))}
.qb:hover{border-color:var(--tc,var(--acc))}
.qb.on{background:var(--tc,var(--acc));border-color:var(--tc,var(--acc));color:#fff}
.qb.on svg{color:#fff}
.qb .n{font-size:11.5px;background:var(--info-bg);color:var(--mute);border-radius:999px;padding:0 7px}
.qb.on .n{background:rgba(255,255,255,.25);color:#fff}
.qsep{width:1px;background:var(--line);margin:6px 2px;flex:none}

/* blocks */
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.chip,.qb,.gpill{transition:none}}
.blk{border-radius:var(--r);background:var(--card);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.blk>header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--tb);border-bottom:1px solid var(--line)}
.blk>header svg{color:var(--tc)}
.blk>header h3{margin:0;font-size:16px;line-height:1.3;flex:1}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;color:var(--tc);background:var(--tb)}
.tag.solid{color:#fff;background:var(--tc)}
.blk .bd{padding:12px 16px 14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:8px;background:var(--tb);color:var(--tc);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.steps li b{font-weight:600}
.subl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:14px;margin-top:10px;background:var(--tb);color:var(--ink)}
.note svg{color:var(--tc);margin-top:2px}
.t-prio{--tc:var(--prio);--tb:var(--prio-bg)}.t-supp{--tc:var(--supp);--tb:var(--supp-bg)}.t-mon{--tc:var(--mon);--tb:var(--mon-bg)}.t-alt{--tc:var(--prio);--tb:light-dark(#f2fbf9,#0f2624)}.t-spec{--tc:var(--spec);--tb:var(--spec-bg)}
.t-caut{--tc:var(--caut);--tb:var(--caut-bg)}.t-dang{--tc:var(--dang);--tb:var(--dang-bg)}.t-info{--tc:var(--info);--tb:var(--info-bg)}

/* drug cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.drug{border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.drug.hl{box-shadow:0 0 0 3px var(--tc)}
.drug .dh{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 8px;background:linear-gradient(180deg,var(--tb),transparent)}
.drug .dh .pill{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tc);color:#fff;flex:none}
.drug h4{margin:0;font-size:15.5px;line-height:1.25}
.drug .cls{font-size:12.5px;color:var(--mute)}
.drug .dh>div{flex:1}.drug .dh .tag{margin-left:auto;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px 14px 10px}
.kv div{background:var(--card2);border-radius:9px;padding:6px 9px;font-size:13.5px}
.kv div.w{grid-column:1/-1}
.kv span{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.drug .ft{display:flex;gap:6px;padding:0 14px 12px;margin-top:auto}
.drug .ft button{flex:1;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13.5px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.drug .ft button:hover{border-color:var(--tc)}
.dx{display:none;padding:0 14px 12px;font-size:14px}
.drug.open .dx{display:block}
.dx dl{margin:0;display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:6px 10px}
.dx dt{color:var(--mute);font-weight:600;font-size:12.5px;padding-top:2px}
.dx dd{margin:0}
.dx dd.d{color:var(--dang)}
.ertag{color:#fff;background:var(--dang);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}

/* tables & lists */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--mute);font-weight:600;background:var(--card2)}
.lst{margin:0;padding-left:20px}
.lst li{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mini h5{margin:0 0 6px;font-size:13.5px;display:flex;gap:6px;align-items:center}

/* flow */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stepper button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.stepper button b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px}
.stepper .ar{color:var(--mute);align-self:center}
.node{border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:14px 16px;margin-bottom:10px;position:relative}
.node.cur{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
.node .ns{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:2px}
.node h4{margin:0 0 6px;font-size:16px}
.node p{margin:0 0 8px;font-size:14.5px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:44px;padding:0 18px;border-radius:11px;border:1.5px solid var(--tc,var(--line));background:var(--card);font-weight:600;color:var(--tc,var(--ink))}
.opt.sel{background:var(--tc,var(--acc));color:#fff;border-color:var(--tc,var(--acc))}
.opt.dim{opacity:.45}
.node.end{background:var(--tb,var(--card))}

/* right panel */
.rp{position:sticky;top:128px;max-height:calc(100vh - 144px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.rp .card{padding:14px}
.rp h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.rbox{border-radius:12px;padding:10px 12px;background:var(--tb);margin-bottom:8px}
.rbox h5{margin:0 0 4px;font-size:13px;color:var(--tc);display:flex;gap:6px;align-items:center}
.rbox ul{margin:0;padding-left:18px;font-size:13.5px}
.rbox li{margin:2px 0}
.rbox button.lnk{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px;text-align:left;font-size:13.5px}
.sel-sum{display:flex;flex-wrap:wrap;gap:6px}
.sel-sum span{font-size:12.5px;background:var(--acc-bg);color:var(--ink);border:1px solid var(--acc);border-radius:999px;padding:2px 9px}
.empty{color:var(--mute);font-size:13.5px;margin:0}

/* calc */
details.calc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
details.calc>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600;min-height:48px}
details.calc>summary::-webkit-details-marker{display:none}
details.calc>summary .r{margin-left:auto;font-weight:700;color:var(--acc);font-size:14px}
details.calc[open]>summary{border-bottom:1px solid var(--line)}
.cb{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld label{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:3px}
.fld input,.fld select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);padding:0 10px;font-size:16px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--acc)}
.res{border-radius:14px;background:var(--acc-bg);padding:14px;display:flex;flex-direction:column;gap:6px}
.res .big{font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1.05;color:var(--acc)}
.res .lab{font-size:13px;color:var(--mute)}
.res p{margin:0;font-size:14px}
.src{font-size:12px;color:var(--mute);grid-column:1/-1;margin:0}

/* refs */
.ref{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:0}
.ref .yr{font-weight:700;color:var(--acc);min-width:3.2em}
.ref a{color:var(--supp);word-break:break-word}
.vstate{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}

/* misc */
.credit{text-align:center;font-size:13px;color:var(--mute);padding:6px 0 2px}.credit b{color:var(--ink);font-weight:600}
.disc{font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--info-bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#10222f;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:min(92vw,520px);font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(6,18,28,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.on{display:flex}

@media (max-width:600px){.tmr-s{grid-template-columns:repeat(2,minmax(0,1fr))}.tmr-g{grid-template-columns:minmax(0,1fr)}}

}

}

  {id:'h0',cat:['er'],t:'dang',def:1,w:()=>true,title:'Điều trị ngay',acts:['Cấy máu × 2 và đờm/dịch hút nội khí quản trước kháng sinh – không trì hoãn kháng sinh quá 1 giờ khi sốc.','Kháng sinh kinh nghiệm theo yếu tố nguy cơ (tab Kháng sinh kinh nghiệm).','Oxy/hỗ trợ hô hấp; hồi sức theo phác đồ nhiễm khuẩn huyết nếu sốc.','Tính CrCl để chỉnh liều; lưu ý ngày đầu thường giữ liều đầy đủ.'],src:['ats_hap16']},
  {id:'h1',cat:['prio'],t:'prio',def:1,w:S=>N(S,'mrsa','mdr','hi','ksd','bl'),title:'Không nguy cơ MRSA/đa kháng, không nặng (chọn MỘT)',lines:[BLHAP('7 ngày'),L('levo','750 mg','Truyền TM/uống','1 lần/ngày','7 ngày',{note:'Lựa chọn đơn trị thay thế'})],src:['ats_hap16']},
  {id:'h1e',cat:['alt'],t:'mon',w:S=>N(S,'mrsa','mdr','hi','ksd'),title:'ERS/ESICM 2017 – nguy cơ thấp (đa kháng < 25%, không yếu tố nguy cơ): phổ hẹp hơn',lines:[OR(L('ertap','1 g','Truyền TM 30 phút','1 lần/ngày','7 ngày'),L('ceftri','2 g','Truyền TM','1 lần/ngày','7 ngày'),L('cefotax','2 g','Tiêm TM','Mỗi 8 giờ','7 ngày'),L('levo','750 mg','Truyền TM/uống','1 lần/ngày','7 ngày'))],src:['ers_hap17']},
  {id:'h2',cat:['prio'],t:'caut',w:S=>H(S,'mrsa'),title:'Nguy cơ MRSA: THÊM một thuốc kháng MRSA',lines:[MRSA2],acts:['Ngừng thuốc kháng MRSA khi cấy (± PCR MRSA mũi) âm tính.'],src:['ats_hap16','vanco20']},

  {id:'h4',cat:['alt'],t:'mon',w:S=>H(S,'bl'),title:'Dị ứng beta-lactam',lines:[OR(L('aztreo','2 g','Truyền TM','Mỗi 8 giờ','7 ngày',{note:'Dị ứng chéo với ceftazidime'}),L('levo','750 mg','Truyền TM','1 lần/ngày','7 ngày'),L('cipro','400 mg','Truyền TM','Mỗi 8 giờ','7 ngày'))],acts:['Cân nhắc đánh giá lại dị ứng (phần lớn không phải dị ứng thật); carbapenem thường dùng được khi dị ứng penicillin không nặng.'],src:['ats_hap16']},
  {id:'h5',cat:['spec'],t:'spec',w:S=>H(S,'ksd'),title:'Có kháng sinh đồ: XUỐNG THANG',acts:['Chọn 1 thuốc nhạy, phổ hẹp nhất; ngừng thuốc thứ hai sau khi biết KSĐ.','Vi khuẩn đa kháng (ESBL, CRE, DTR-PA, CRAB, Stenotrophomonas, MRSA) → bài "Viêm phổi do vi khuẩn đa kháng".','Ngừng kháng MRSA nếu cấy âm tính.'],link:'mdrp',src:['ats_hap16']},
  {id:'h6',cat:['spec'],t:'spec',w:S=>H(S,'po'),title:'Chuyển đường uống (ổn định, uống được, có thuốc uống nhạy)',lines:[OR(L('levo','750 mg','Uống','1 lần/ngày','Đủ 7 ngày'),L('linez','600 mg','Uống','2 lần/ngày','Đủ 7 ngày'),L('smx','1–2 viên 800/160 mg (theo cân nặng)','Uống','2 lần/ngày','Đủ 7 ngày'),L('augm','875/125 mg','Uống','2 lần/ngày','Đủ 7 ngày'))],acts:['Chỉ chọn thuốc vi khuẩn nhạy theo KSĐ.'],rv:1},
  {id:'h7',cat:['fail'],t:'dang',w:S=>H(S,'fail'),title:'Thất bại sau 48–72 giờ',acts:['Xem lại cấy, KSĐ; cấy lại; tìm vi khuẩn đa kháng, nấm, virus.','CT ngực: áp xe, tràn mủ màng phổi; chẩn đoán khác (phù phổi, ARDS, thuyên tắc, xẹp phổi).','Nội soi phế quản lấy bệnh phẩm khi cần.','Kiểm tra liều/thâm nhập thuốc (chỉnh theo CrCl, AUC vancomycin).'],refer:['Hội chẩn hồi sức/nhiễm khuẩn'],src:['ats_hap16']},
  {id:'h8',cat:['ipd'],t:'mon',w:()=>true,title:'Thủ thuật/bệnh phẩm',acts:['Dịch hút nội khí quản bán định lượng (VAP) – ATS/IDSA 2016 ưu tiên bệnh phẩm không xâm nhập.','Nội soi phế quản/BAL khi thất bại hoặc nghi tác nhân bất thường.','Chọc dịch màng phổi nếu có tràn dịch đáng kể.'],src:['ats_hap16']}],

D.mdrp={id:'mdrp',g:'resp',name:'Viêm phổi do vi khuẩn đa kháng',defView:'t:emp',tabs:TABS_ABX,
 keys:'đa kháng esbl ampc cre kpc ndm mbl oxa-48 dtr pseudomonas crab acinetobacter stenotrophomonas mrsa colistin polymyxin ceftazidime avibactam cefiderocol sulbactam durlobactam',

 def:'Không tự động chọn kháng sinh chỉ theo tên vi khuẩn: cần kháng sinh đồ, cơ chế kháng (KPC/MBL/OXA-48 nếu có), vị trí nhiễm, mức độ nặng, chức năng thận. Phân biệt NHIỄM KHUẨN THỰC SỰ với VI KHUẨN ĐỊNH CƯ (đờm/nội khí quản dương tính không có biểu hiện viêm phổi mới → không điều trị).',

 sev:['Không mặc định phối hợp nhiều kháng sinh: chỉ phối hợp khi khuyến cáo (CRAB, MBL dùng ceftazidime/avibactam + aztreonam, S. maltophilia khi không dùng cefiderocol).'],red:['Sốc nhiễm khuẩn','Tổn thương thận cấp khi dùng polymyxin/aminoglycosid'],

 regs:[
  {id:'m0',cat:['er'],t:'caut',def:1,w:()=>true,title:'Trước khi chọn kháng sinh',acts:['Xác nhận nhiễm khuẩn thực sự (lâm sàng + X quang mới), không điều trị vi khuẩn định cư.','Kháng sinh đồ + MIC; xét nghiệm carbapenemase (KPC, NDM, OXA-48) với CRE/DTR.','Tính CrCl, xác định chế độ thận: ổn định / tổn thương thận cấp / lọc máu ngắt quãng / CRRT.','Hội chẩn nhiễm khuẩn – dược lâm sàng.'],src:['idsa_amr24','idsa_amr26']},
  {id:'m_col',cat:['spec'],t:'caut',w:S=>H(S,'colon'),title:'Nghi chỉ định cư',acts:['Không bắt đầu/không tiếp tục kháng sinh chỉ vì cấy đờm dương tính khi không có viêm phổi mới.','Theo dõi lâm sàng; cấy lại khi có dấu hiệu nhiễm khuẩn.'],src:['idsa_amr26']},
  {id:'m_esbl',cat:['prio','spec'],t:'prio',w:S=>H(S,'esbl'),title:'ESBL (ngoài đường niệu): carbapenem',lines:[OR(L('mero','1 g','Truyền TM','Mỗi 8 giờ','7 ngày (theo đáp ứng)'),L('imip','500 mg','Truyền TM','Mỗi 6 giờ','7 ngày'),L('ertap','1 g','Truyền TM','1 lần/ngày','7 ngày (không dùng khi sốc nặng/giảm albumin nặng – theo nhận định lâm sàng)'))],acts:['Sau đáp ứng: chuyển uống nếu nhạy (cotrimoxazol, ciprofloxacin, levofloxacin).'],avoid:['Piperacillin-tazobactam, cefepime cho nhiễm khuẩn ngoài đường niệu do ESBL dù báo nhạy'],src:['idsa_amr24','idsa_amr26']},
  {id:'m_ampc',cat:['prio','spec'],t:'prio',w:S=>H(S,'ampc'),title:'AmpC nguy cơ trung bình – cao (Enterobacter cloacae, K. aerogenes, C. freundii, Hafnia alvei)',lines:[OR(L('cefep','2 g','Truyền TM (3 giờ khi phù hợp)','Mỗi 8 giờ','7 ngày',{note:'Khi MIC cefepime ≤ 2'}),L('mero','1 g','Truyền TM','Mỗi 8 giờ','7 ngày',{note:'Khi MIC cefepime ≥ 4'}))],avoid:['Ceftriaxone cho nhiễm khuẩn nặng (có thể tiếp tục khi không nặng, đã kiểm soát ổ, đã cải thiện – IDSA 2026)','Piperacillin-tazobactam cho nhiễm khuẩn xâm lấn'],src:['idsa_amr24','idsa_amr26']},
  {id:'m_kpc',cat:['prio','spec'],t:'caut',w:S=>H(S,'kpc'),title:'CRE – KPC (chọn MỘT)',lines:[OR(L('cazavi','2,5 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày'),L('merovab','4 g (2 g/2 g)','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày'),L('imirel','1,25 g','Truyền TM 30 phút','Mỗi 6 giờ','7 ngày'),L('cefid','2 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày',{note:'Lựa chọn thay thế'}))],acts:['CRE còn nhạy meropenem nhưng kháng ertapenem, không có carbapenemase: meropenem 2 g mỗi 8 giờ truyền 3 giờ.'],avoid:['Polymyxin (chỉ khi không còn lựa chọn)'],src:['idsa_amr24','idsa_amr26']},
  {id:'m_mbl',cat:['prio','spec'],t:'dang',w:S=>H(S,'mbl'),title:'NDM / MBL khác',ind:'IDSA 2026: aztreonam/avibactam HOẶC ceftazidime/avibactam + aztreonam (ưu tiên nhẹ aztreonam/avibactam); cefiderocol là lựa chọn khác.',
   lines:[OR(L('aztavi','Nạp 2 g/0,67 g, sau đó 1,5 g/0,5 g','Truyền TM 3 giờ','Mỗi 6 giờ','7 ngày'),[L('cazavi','2,5 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày',{note:'Truyền CÙNG LÚC với aztreonam (chung thời điểm)'}),L('aztreo','2 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày')],L('cefid','2 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày'))],
   avoid:['Ceftazidime/avibactam ĐƠN ĐỘC (MBL thủy phân ceftazidime)','Meropenem/vaborbactam, imipenem/relebactam (không tác dụng trên MBL)'],src:['idsa_amr26','idsa_amr24'],rv:1},
  {id:'m_oxa',cat:['prio','spec'],t:'caut',w:S=>H(S,'oxa'),title:'OXA-48-like',lines:[OR(L('cazavi','2,5 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày'),L('cefid','2 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày',{note:'Thay thế'}))],avoid:['Meropenem/vaborbactam, imipenem/relebactam (không ức chế OXA-48)'],src:['idsa_amr24']},
  {id:'m_cre',cat:['spec'],t:'caut',w:S=>H(S,'cre'),title:'CRE chưa rõ cơ chế',acts:['Làm xét nghiệm carbapenemase ngay. Trong khi chờ: chọn theo dịch tễ cơ chế tại đơn vị và kháng sinh đồ; hội chẩn nhiễm khuẩn.'],src:['idsa_amr26']},
  {id:'m_dtr',cat:['prio','spec'],t:'caut',w:S=>H(S,'dtr'),title:'P. aeruginosa DTR (viêm phổi)',ind:'IDSA 2026: dữ liệu so sánh ủng hộ ceftolozane/tazobactam trong viêm phổi DTR.',lines:[OR(L('ctz','3 g (2 g/1 g)','Truyền TM 1 giờ','Mỗi 8 giờ','7 ngày'),L('cazavi','2,5 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày'),L('imirel','1,25 g','Truyền TM 30 phút','Mỗi 6 giờ','7 ngày'),L('cefid','2 g','Truyền TM 3 giờ','Mỗi 8 giờ','7 ngày',{note:'Ưu tiên khi DTR sinh MBL'}))],acts:['Không phối hợp thường quy khi đã nhạy với thuốc mới. Imipenem/relebactam và ceftazidime/avibactam có nguy cơ xuất hiện kháng trong điều trị – cấy lại khi không đáp ứng.'],avoid:['Kháng sinh dạng khí dung thường quy (IDSA 2026: không ưu tiên)'],src:['idsa_amr26','idsa_amr24']},
  {id:'m_crab',cat:['prio','spec'],t:'dang',w:S=>H(S,'crab')&&N(S,'noNew'),title:'CRAB xâm lấn: sulbactam/durlobactam + carbapenem (ưu tiên)',lines:[L('suldur','1 g/1 g','Truyền TM 3 giờ','Mỗi 6 giờ','7–14 ngày theo đáp ứng'),OR(L('imip','500 mg','Truyền TM','Mỗi 6 giờ','Cùng thời gian'),L('mero','1 g','Truyền TM','Mỗi 8 giờ','Cùng thời gian'))],acts:['Các lựa chọn khác chỉ là "cầu nối" đến khi có sulbactam/durlobactam (IDSA 2026).'],src:['idsa_amr26','idsa_amr24']},

 regs:[
  {id:'p0',cat:['er'],t:'dang',def:1,w:()=>true,title:'Điều trị ngay',acts:['Đánh giá suy hô hấp; oxy.','Tràn dịch lượng lớn gây khó thở: chọc tháo dưới siêu âm, mỗi lần không quá 1,5 L (nguy cơ phù phổi tái giãn nở).','Sốt + tràn dịch: chọc dò sớm tìm mủ, đo pH bằng máy khí máu (bơm tiêm heparin, tránh không khí).'],src:['bts_proc23','bts_pl23']},
  {id:'p1',cat:['ipd'],t:'mon',def:1,w:()=>true,title:'Chọc dò chẩn đoán và xét nghiệm',acts:['Chỉ định: tràn dịch một bên/không điển hình, sốt, nghi nhiễm trùng, ác tính; suy tim tràn dịch hai bên điển hình có thể không cần chọc.','Luôn dưới hướng dẫn siêu âm (BTS 2023); ngừng/đánh giá thuốc chống đông theo nguy cơ.','Xét nghiệm: protein, LDH (+ máu), pH (máy khí máu), glucose, tế bào, Gram + cấy (cả chai cấy máu), tế bào học (gửi lượng dịch đủ lớn), ADA khi nghi lao, TG/cholesterol khi nghi dưỡng chấp, Hct khi dịch máu.','Ý nghĩa: pH < 7,2 → dẫn lưu (nhiễm trùng); glucose thấp → mủ, lao, viêm khớp dạng thấp, ác tính; LDH rất cao → mủ; ADA cao gợi ý lao ở vùng lưu hành cao.'],src:['bts_pl23','bts_proc23'],rv:1},
  {id:'p2',cat:['prio'],t:'prio',w:S=>H(S,'hf'),title:'Do suy tim',lines:[L('furo','40–80 mg (tăng theo đáp ứng)','Tiêm TM chậm hoặc uống','1–2 lần/ngày','Đến khi hết quá tải',{note:'Đã dùng lợi tiểu: dịch có thể thành "dịch tiết giả" – dùng chênh lệch albumin máu – dịch > 12 g/L'})],acts:['Chọc tháo khi khó thở nhiều; tối ưu điều trị suy tim.'],src:['bts_pl23']},
  {id:'p3',cat:['prio'],t:'prio',w:S=>H(S,'cirr'),title:'Tràn dịch do xơ gan (hepatic hydrothorax)',lines:[L('spiro','100 mg (tăng dần, tối đa 400 mg)','Uống','1 lần/ngày','Kéo dài'),L('furo','40 mg (tối đa 160 mg)','Uống','1 lần/ngày','Kéo dài')],acts:['Ăn nhạt; chọc tháo khi khó thở.','Tránh đặt dẫn lưu màng phổi (biến chứng cao); cân nhắc TIPS, ghép gan.'],avoid:['Dẫn lưu màng phổi thường quy'],link:'cirr',src:['bts_pl23']},
  {id:'p4',cat:['prio'],t:'prio',w:S=>H(S,'renal'),title:'Do suy thận',acts:['Siêu lọc/lọc máu tối ưu; chọc tháo khi khó thở; tìm nguyên nhân khác nếu dịch tiết.']},
  {id:'p5',cat:['prio'],t:'prio',w:S=>H(S,'para'),title:'Cạnh viêm phổi đơn giản',acts:['Kháng sinh như viêm phổi (bài Viêm phổi cộng đồng/bệnh viện); theo dõi tiến triển, chọc lại nếu tăng/sốt kéo dài.'],link:'cap'},
  {id:'p6',cat:['spec','ipd'],t:'caut',w:S=>H(S,'cpara','emp')&&N(S,'hosp'),title:'Nhiễm trùng màng phổi mắc phải cộng đồng: dẫn lưu + kháng sinh phủ kỵ khí',lines:[OR(L('augm','1,2 g','Tiêm TM','Mỗi 8 giờ','Chuyển uống 625 mg × 3 lần/ngày khi cải thiện'),[L('cefur','1,5 g','Tiêm TM','Mỗi 8 giờ','Theo đáp ứng'),L('met','500 mg','Truyền TM/uống','Mỗi 8 giờ','Theo đáp ứng')],[L('ceftri','2 g','Truyền TM','1 lần/ngày','Theo đáp ứng'),L('met','500 mg','Truyền TM/uống','Mỗi 8 giờ','Theo đáp ứng')])],acts:['Dẫn lưu ống nhỏ (12–14F) dưới siêu âm khi: mủ, pH < 7,2, Gram/cấy dương tính.','Thời gian kháng sinh thường vài tuần theo đáp ứng và dẫn lưu – chờ kiểm duyệt theo BTS 2023.'],avoid:['Aminoglycosid (thâm nhập màng phổi kém, bất hoạt trong mủ)'],src:['bts_pl23','bts_proc23'],rv:1},
  {id:'p7',cat:['spec','ipd'],t:'caut',w:S=>A(S,'hosp')&&H(S,'cpara','emp'),title:'Nhiễm trùng màng phổi mắc phải bệnh viện',lines:[OR(L('piptazo','4,5 g','Truyền TM','Mỗi 6 giờ','Theo đáp ứng'),L('mero','1 g','Truyền TM','Mỗi 8 giờ','Theo đáp ứng')),L('vanco','15–20 mg/kg (khi nguy cơ MRSA)','Truyền TM','Mỗi 8–12 giờ, chỉnh AUC','Theo đáp ứng',{opt:1})],src:['bts_pl23']},
  {id:'p8',cat:['fail','ipd'],t:'caut',w:S=>H(S,'fail','emp'),title:'Ổ dịch tồn lưu: alteplase + DNase nội màng phổi',ind:'Khi dẫn lưu + kháng sinh chưa hiệu quả, còn ổ dịch; thay thế/cầu nối phẫu thuật (BTS 2023).',lines:[L('alte','10 mg trong 30 mL NaCl 0,9%','Bơm qua ống dẫn lưu, kẹp 1 giờ','2 lần/ngày','3 ngày (6 liều)'),L('dnase','5 mg trong 30 mL','Bơm qua ống dẫn lưu sau alteplase, kẹp 1 giờ','2 lần/ngày','3 ngày (6 liều)')],warn:['Nguy cơ chảy máu màng phổi: kiểm tra đông máu, ngừng chống đông liều điều trị nếu có thể; không dùng khi rò phế quản – màng phổi'],refer:['Hội chẩn ngoại lồng ngực sớm nếu nhiễm khuẩn huyết dai dẳng/ổ dịch không giảm'],src:['mist2','bts_pl23'],rv:1},
  {id:'p9',cat:['spec'],t:'spec',w:S=>H(S,'tb'),title:'Lao màng phổi',acts:['Điều trị lao theo Chương trình chống lao quốc gia (phác đồ chuẩn 6 tháng); không dẫn lưu thường quy.','ADA dịch cao, lympho ưu thế hỗ trợ chẩn đoán ở vùng lưu hành cao; sinh thiết màng phổi khi chưa chắc chắn.'],refer:['Chuyên khoa lao']},
  {id:'p10',cat:['spec'],t:'spec',w:S=>H(S,'mal'),title:'Tràn dịch ác tính',acts:['Chọc tháo giảm triệu chứng; tái phát: ống thông màng phổi lưu (IPC) hoặc gây dính bằng talc – BTS 2023.'],refer:['Ung bướu/hô hấp can thiệp'],src:['bts_pl23']},
  {id:'p11',cat:['er'],t:'dang',w:S=>H(S,'hemo'),title:'Tràn máu màng phổi',acts:['Hct dịch/máu > 0,5. Dẫn lưu màng phổi; hồi sức.','Hội chẩn ngoại lồng ngực ngay khi dẫn lưu nhiều hoặc huyết động không ổn định (tiêu chí kinh điển: > 1500 mL ngay hoặc > 200 mL/giờ × 2–4 giờ).'],refer:['Ngoại lồng ngực'],rv:1},
  {id:'p12',cat:['spec'],t:'spec',w:S=>H(S,'chyl'),title:'Tràn dưỡng chấp',lines:[L('octr','100–200 mcg','Tiêm dưới da','3 lần/ngày','Theo đáp ứng (ngoài chỉ định chính thức)',{opt:1})],acts:['TG dịch > 1,24 mmol/L (110 mg/dL). Chế độ ăn ít mỡ, dùng triglycerid chuỗi trung bình; dinh dưỡng tĩnh mạch nếu lưu lượng cao.','Lưu lượng cao kéo dài: hội chẩn ngoại khoa (thắt ống ngực/nút mạch).'],rv:1}],

  run(v){const bm=Math.max(1,v.bili/17.1),im=Math.max(1,v.inr),cm=Math.max(1,v.cr/88.4),c1=v.dial?4:Math.min(cm,4),na=clamp(v.na,125,137);
   const meld=Math.round((0.957*ln(c1)+0.378*ln(bm)+1.120*ln(im)+0.643)*10);let mna=meld>11?meld+1.32*(137-na)-0.033*meld*(137-na):meld;mna=Math.min(40,Math.round(mna));
   const o={big:String(mna),lab:'MELD-Na',tone:mna>=15?'dang':mna>=10?'caut':'prio',txt:'MELD gốc '+Math.min(40,meld)+'. ≥ 15: cân nhắc giới thiệu đánh giá ghép gan.'};
   if(v.alb!=null&&v.sex!=null){const c3=v.dial?3:clamp(cm,1,3),al=clamp(v.alb/10,1.5,3.5);let m3=1.33*v.sex+4.56*ln(bm)+0.82*(137-na)-0.24*(137-na)*ln(bm)+9.09*ln(im)+11.14*ln(c3)+1.85*(3.5-al)-1.83*(3.5-al)*ln(c3)+6;o.big2=String(Math.min(40,Math.round(m3)));o.lab2='MELD 3.0';}
   else o.txt+=' Nhập albumin và giới để tính MELD 3.0.';return o}},
 bisap:{name:'BISAP (viêm tụy cấp)',src:'Wu BU et al. Gut 2008. Đánh giá trong 24 giờ đầu. BUN 25 mg/dL ≈ ure 8,9 mmol/L.',
  f:[{k:'b',l:'Ure > 8,9 mmol/L',t:'ck'},{k:'i',l:'Rối loạn ý thức (Glasgow < 15)',t:'ck'},{k:'s',l:'SIRS ≥ 2 tiêu chí',t:'ck'},{k:'a',l:'Tuổi > 60',t:'ck'},{k:'p',l:'Tràn dịch màng phổi',t:'ck'}],req:[],
  note:'SIRS: nhiệt độ > 38 hoặc < 36 °C; mạch > 90; nhịp thở > 20 hoặc PaCO2 < 32 mmHg; bạch cầu > 12 hoặc < 4 G/L.',
  run(v){const s=['b','i','s','a','p'].reduce((t,k)=>t+(v[k]?1:0),0);return{big:s+'/5',lab:'BISAP',tone:s>=3?'dang':'prio',txt:s>=3?'≥ 3: nguy cơ tử vong tăng rõ.':'< 3: nguy cơ thấp – không thay thế đánh giá suy cơ quan.'}}},
 gbs:{name:'Glasgow-Blatchford (XHTH trên)',src:'Blatchford O et al. Lancet 2000. ACG 2021: 0–1 điểm có thể ngoại trú.',
  f:[{k:'u',l:'Ure máu (mmol/L)',t:'num',min:0.5,max:100},{k:'hb',l:'Hemoglobin (g/L)',t:'num',min:20,max:220},{k:'sex',l:'Giới',t:'sel',o:[['','— chọn —'],['0','Nam'],['1','Nữ']]},{k:'sbp',l:'HA tâm thu (mmHg)',t:'num',min:30,max:260},{k:'hr',l:'Mạch (lần/phút)',t:'num',min:20,max:250},
     {k:'mel',l:'Phân đen',t:'ck'},{k:'syn',l:'Ngất',t:'ck'},{k:'liv',l:'Bệnh gan',t:'ck'},{k:'hf',l:'Suy tim',t:'ck'}],req:['u','hb','sex','sbp','hr'],
  run(v){let s=0;const u=v.u;s+=u>=25?6:u>=10?4:u>=8?3:u>=6.5?2:0;const hb=v.hb;if(v.sex===0)s+=hb<100?6:hb<120?3:hb<130?1:0;else s+=hb<100?6:hb<120?1:0;
   s+=v.sbp<90?3:v.sbp<100?2:v.sbp<110?1:0;if(v.hr>=100)s+=1;if(v.mel)s+=1;if(v.syn)s+=2;if(v.liv)s+=2;if(v.hf)s+=2;
   return{big:s+' điểm',lab:'Glasgow-Blatchford',tone:s<=1?'prio':s>=7?'dang':'caut',txt:s<=1?'Nguy cơ rất thấp: có thể ngoại trú, nội soi hẹn sớm.':'≥ 2: nhập viện, nội soi trong 24 giờ.'}}},
 crcl:{name:'Độ thanh thải creatinin và eGFR',src:'Cockcroft-Gault (dùng tra bảng chỉnh liều thuốc). CKD-EPI 2021 không hệ số chủng tộc. Không dùng khi creatinin chưa ổn định.',
  f:[{k:'age',l:'Tuổi',t:'num',min:18,max:110},{k:'wt',l:'Cân nặng (kg)',t:'num',min:20,max:250},{k:'cr',l:'Creatinin (µmol/L)',t:'num',min:15,max:2000},{k:'sex',l:'Giới',t:'sel',o:[['','— chọn —'],['0','Nam'],['1','Nữ']]}],req:['age','cr','sex'],
  run(v){const s=v.cr/88.4,F=v.sex===1,k=F?0.7:0.9,a=F?-0.241:-0.302,eg=142*Math.pow(Math.min(s/k,1),a)*Math.pow(Math.max(s/k,1),-1.2)*Math.pow(0.9938,v.age)*(F?1.012:1);
   const o={big:fmt(eg),lab:'eGFR CKD-EPI 2021 (mL/phút/1,73 m²)',tone:eg<30?'dang':eg<60?'caut':'prio',txt:''};
   if(v.wt!=null){o.big2=fmt((140-v.age)*v.wt/(72*s)*(F?0.85:1));o.lab2='CrCl Cockcroft-Gault (mL/phút)';o.txt='Dùng CrCl để tra mục Chỉnh liều thận.';}else o.txt='Nhập cân nặng để tính CrCl (chỉnh liều thuốc).';return o}},
 curb:{name:'CURB-65 (viêm phổi cộng đồng)',src:'Lim WS et al. Thorax 2003.',
  f:[{k:'c',l:'Lú lẫn mới',t:'ck'},{k:'u',l:'Ure máu (mmol/L)',t:'num',min:0.5,max:100},{k:'rr',l:'Nhịp thở (lần/phút)',t:'num',min:4,max:80},{k:'sbp',l:'HA tâm thu',t:'num',min:30,max:260},{k:'dbp',l:'HA tâm trương',t:'num',min:10,max:160},{k:'age',l:'Tuổi',t:'num',min:18,max:110}],req:['u','rr','sbp','dbp','age'],
  run(v){const s=(v.c?1:0)+(v.u>7?1:0)+(v.rr>=30?1:0)+((v.sbp<90||v.dbp<=60)?1:0)+(v.age>=65?1:0);return{big:s+'/5',lab:'CURB-65',tone:s>=3?'dang':s===2?'caut':'prio',txt:s<=1?'0–1: có thể ngoại trú.':s===2?'2: cân nhắc nhập viện.':'≥ 3: nặng; 4–5 cân nhắc ICU.'}}},
 na:{name:'Ước tính thay đổi natri khi truyền dịch (Adrogué–Madias)',src:'Adrogué HJ, Madias NE. N Engl J Med 2000. Chỉ là ƯỚC TÍNH – bắt buộc đo Na thực tế theo lịch. Giới hạn: ≤ 10 mmol/L trong 24 giờ đầu (châu Âu 2014).',
  f:[{k:'na',l:'Na máu hiện tại (mmol/L)',t:'num',min:95,max:175},{k:'wt',l:'Cân nặng (kg)',t:'num',min:20,max:250},{k:'tbw',l:'Nhóm (hệ số nước toàn cơ thể)',t:'sel',o:[['','— chọn —'],['0.6','Nam < 65 tuổi (0,6)'],['0.5','Nữ < 65 / Nam ≥ 65 (0,5)'],['0.45','Nữ ≥ 65 tuổi (0,45)']]},
     {k:'inf',l:'Dịch truyền',t:'sel',o:[['','— chọn —'],['513','NaCl 3% (513 mmol/L)'],['154','NaCl 0,9% (154)'],['130','Ringer lactat (130)'],['77','NaCl 0,45% (77)'],['0','Glucose 5% (0)']]},{k:'kinf',l:'K thêm vào dịch (mmol/L, nếu có)',t:'num',min:0,max:80},{k:'target',l:'Mức tăng Na mong muốn (mmol/L)',t:'num',min:1,max:20}],req:['na','wt','tbw','inf'],
  run(v){const tbw=v.wt*v.tbw,d=((v.inf+(v.kinf||0))-v.na)/(tbw+1);const o={big:(d>0?'+':'')+fmt(d,2)+' mmol/L',lab:'Thay đổi Na ước tính cho mỗi 1 L dịch',tone:'prio',txt:'Nước toàn cơ thể ≈ '+fmt(tbw,1)+' L.'};
   if(v.target!=null){if(d<=0){o.txt+=' Dịch này không làm tăng Na.';o.tone='caut';}else{const L=v.target/d;o.big2=fmt(L*1000,0)+' mL';o.lab2='Thể tích ước tính để tăng '+v.target+' mmol/L';if(v.target>10){o.tone='dang';o.txt+=' CẢNH BÁO: mục tiêu > 10 mmol/L/24 giờ vượt giới hạn an toàn.';}}}
   if(v.inf===513)o.txt+=' Triệu chứng nặng: 150 mL NaCl 3%/20 phút, kiểm tra Na sau 20 phút (châu Âu 2014).';return o}},
 wdose:{name:'Liều theo cân nặng',src:'Albumin: AASLD 2021, Sort 1999. Ringer lactat: ACG 2024/WATERFALL. Insulin nền: ADA 2026. Vancomycin/amikacin: liều khởi đầu – chỉnh theo nồng độ thuốc. Kiểm tra lại trước khi y lệnh.',
  f:[{k:'wt',l:'Cân nặng (kg)',t:'num',min:20,max:250}],req:['wt'],
  run(v){const w=v.wt,a=g=>fmt(g)+' g ≈ '+fmt(g/0.2)+' mL albumin 20%';
   return{table:[['Albumin SBP ngày 1 (1,5 g/kg)',a(1.5*w)],['Albumin SBP ngày 3 (1 g/kg)',a(w)],['Albumin tổn thương thận cấp (1 g/kg/ngày, tối đa 100 g)',a(Math.min(100,w))],
    ['Ringer lactat bolus 10 mL/kg (chỉ khi giảm thể tích)',fmt(10*w)+' mL'],['Ringer lactat duy trì 1,5 mL/kg/giờ',fmt(1.5*w,1)+' mL/giờ'],
    ['Insulin truyền 0,1–0,3 đơn vị/kg/giờ (tăng TG)',fmt(0.1*w,1)+' – '+fmt(0.3*w,1)+' đơn vị/giờ'],['Insulin nền khởi đầu 0,1–0,2 đơn vị/kg/ngày',fmt(0.1*w,0)+' – '+fmt(0.2*w,0)+' đơn vị/ngày'],
    ['Vancomycin duy trì 15–20 mg/kg/lần',fmt(15*w)+' – '+fmt(20*w)+' mg/lần'],['Vancomycin nạp 20–35 mg/kg (tối đa 3 g)',fmt(Math.min(3000,20*w))+' – '+fmt(Math.min(3000,35*w))+' mg'],
    ['Amikacin 15 mg/kg/ngày',fmt(15*w)+' mg/ngày'],['Paracetamol 15 mg/kg/lần (khi < 50 kg)',w<50?fmt(15*w)+' mg/lần':'≥ 50 kg: 1 g/lần']]}}},
 adrim:{name:'Adrenalin tiêm bắp theo tuổi/cân nặng (ống 1 mg/mL)',src:'RCUK 2021 (theo tuổi). TT51/2017: 0,01 mg/kg – đối chiếu bảng Phụ lục III. Hai nguồn hiển thị tách riêng, không trộn.',
  f:[{k:'wt',l:'Cân nặng (kg)',t:'num',min:1,max:250},{k:'age',l:'Nhóm tuổi',t:'sel',o:[['','— chọn —'],['a','Người lớn / > 12 tuổi'],['c3','6–12 tuổi'],['c2','6 tháng – 6 tuổi'],['c1','< 6 tháng']]}],req:['age'],
  run(v){const R={a:[0.5,'0,5 mg'],c3:[0.3,'0,3 mg'],c2:[0.15,'0,15 mg'],c1:[0.1,'0,1–0,15 mg']}[v.age];
   const o={big:R[1]+' = '+fmt(R[0],2)+' mL',lab:'RCUK 2021 – tiêm bắp, nhắc lại sau 5 phút',tone:'dang',txt:''};
   if(v.age==='a'){o.big2='0,5–1 mg = 0,5–1 mL';o.lab2='TT51 – người lớn, nhắc lại mỗi 3–5 phút';}
   else if(v.wt!=null){const t=Math.min(0.5,0.01*v.wt);o.big2=fmt(t,2)+' mg = '+fmt(t,2)+' mL';o.lab2='TT51 – 0,01 mg/kg (giới hạn 0,5 mg ở trẻ em – chờ kiểm duyệt)';}
   else o.txt='Nhập cân nặng để tính liều trẻ em theo TT51.';
   o.txt+=' Ống 1 mg/mL: số mg = số mL. Tiêm bắp mặt trước ngoài đùi.';return o}},
 adr:{name:'Adrenalin truyền TM liên tục',src:'Tốc độ (mL/giờ) = liều (µg/kg/phút) × cân nặng × 60 ÷ nồng độ (µg/mL). Khởi đầu theo TT51: 0,1 µg/kg/phút. Chỉ bác sĩ xác nhận mới thành y lệnh.',
  presets:[{n:'Adrenalin',c:[[1,50,'1 mg/50 mL (20 µg/mL)'],[1,100,'1 mg/100 mL (10 µg/mL)'],[1,250,'1 mg/250 mL (4 µg/mL)']]}],
  f:[{k:'wt',l:'Cân nặng (kg)',t:'num',min:1,max:250},{k:'amp',l:'Số ống 1 mg',t:'num',min:1,max:10},{k:'vol',l:'Thể tích cuối (mL)',t:'num',min:10,max:500},{k:'dose',l:'Liều (µg/kg/phút)',t:'num',step:'0.01',min:0.01,max:2,pm:0.05}],req:['wt','amp','vol','dose'],
  run(v){const conc=v.amp*1000/v.vol,ugmin=v.dose*v.wt,rate=ugmin*60/conc,w=[];let tone='dang';
   if(v.dose>1)w.push('Liều > 1 µg/kg/phút: rất cao – kiểm tra lại, hội chẩn hồi sức.');else if(v.dose>0.5)w.push('Liều > 0,5 µg/kg/phút: cân nhắc thêm vận mạch thứ hai.');
   if(conc>100)w.push('Nồng độ > 100 µg/mL: kiểm tra lại số ống/thể tích.');if(rate>200)w.push('Tốc độ > 200 mL/giờ: không phù hợp bơm tiêm – tăng nồng độ.');
   w.push('Bơm tiêm điện, đường truyền riêng, monitor liên tục. KHÔNG tiêm TM trực tiếp ống 1 mg/mL.');
   return{big:fmt(rate,1)+' mL/giờ',lab:'Tốc độ truyền',tone,big2:fmt(v.dose,2)+' µg/kg/phút · '+fmt(ugmin,1)+' µg/phút',lab2:'Liều đang tính',txt:'Nồng độ '+fmt(conc,1)+' µg/mL ('+v.amp+' mg/'+v.vol+' mL). Hết bơm sau ≈ '+fmt(v.vol/rate,1)+' giờ.',warn:w}}},
 fluid:{name:'Bù dịch trong phản vệ',src:'RCUK 2021: bolus 500–1000 mL (người lớn), 10 mL/kg (trẻ em). TT51: 1–2 L (người lớn), 10–20 mL/kg (trẻ em) trong 10–20 phút đầu. Đánh giá lại sau mỗi bolus.',
  f:[{k:'wt',l:'Cân nặng (kg)',t:'num',min:1,max:250},{k:'grp',l:'Đối tượng',t:'sel',o:[['','— chọn —'],['a','Người lớn'],['c','Trẻ em']]}],req:['grp'],
  run(v){if(v.grp==='a')return{table:[['RCUK – bolus người lớn','500–1000 mL'],['TT51 – người lớn','1–2 L (nhắc lại theo đáp ứng)'],['Kháng trị (RCUK)','Có thể cần 3–5 L – theo dõi quá tải']]};
   if(v.wt==null)return{miss:['wt']};const w=v.wt;return{table:[['RCUK – trẻ em 10 mL/kg',fmt(10*w)+' mL/bolus'],['TT51 – trẻ em 10–20 mL/kg (10–20 phút đầu)',fmt(10*w)+' – '+fmt(20*w)+' mL']]}}},

 pump:{name:'Tốc độ bơm tiêm điện',src:'Tốc độ (mL/giờ) = liều mỗi giờ ÷ nồng độ. Giới hạn liều là mức tham khảo từ các thẻ thuốc – không tự xác nhận y lệnh.',
  presets:[
   {n:'Noradrenalin',u:'mcg',du:'kgmin',c:[[4000,50,'4 mg/50 mL (80 mcg/mL)'],[8000,50,'8 mg/50 mL (160 mcg/mL)']],dose:0.05,min:0.01,max:1,hi:0.5,note:'Đường truyền trung tâm.'},
   {n:'Insulin nhanh (theo kg)',u:'đv',du:'kgh',c:[[50,50,'50 đơn vị/50 mL (1 đv/mL)']],dose:0.1,min:0.02,max:0.3},
   {n:'Esomeprazole/Pantoprazole',u:'mg',du:'h',c:[[80,50,'80 mg/50 mL (1,6 mg/mL)']],dose:8,min:4,max:8},
   {n:'Octreotide',u:'mcg',du:'h',c:[[500,50,'500 mcg/50 mL (10 mcg/mL)']],dose:50,min:25,max:50},
   {n:'Somatostatin',u:'mcg',du:'h',c:[[3000,48,'3 mg/48 mL (62,5 mcg/mL)']],dose:250,min:250,max:500},
   {n:'Terlipressin truyền liên tục',u:'mg',du:'day',c:[[2,50,'2 mg/50 mL'],[4,50,'4 mg/50 mL']],dose:2,min:2,max:12},
   {n:'Kali clorid (đường trung tâm)',u:'mmol',du:'h',c:[[20,50,'20 mmol/50 mL (400 mmol/L)']],dose:10,min:1,max:20,cmax:40,note:'Nồng độ > 40 mmol/L: chỉ đường trung tâm + monitor điện tim.'}],
  f:[{k:'amt',l:'Lượng thuốc trong bơm',t:'num',min:0.001,max:100000},{k:'u',l:'Đơn vị lượng thuốc',t:'sel',o:[['mg','mg'],['mcg','mcg'],['đv','đơn vị'],['mmol','mmol']]},{k:'vol',l:'Thể tích pha (mL)',t:'num',min:1,max:100},
     {k:'dose',l:'Liều chỉ định',t:'num',step:'any',min:0.0001,max:100000},{k:'du',l:'Kiểu liều',t:'sel',o:[['h','(đơn vị)/giờ'],['kgmin','(đơn vị)/kg/phút'],['kgh','(đơn vị)/kg/giờ'],['day','(đơn vị)/24 giờ']]},{k:'wt',l:'Cân nặng (kg) – khi liều theo kg',t:'num',min:20,max:250}],req:['amt','vol','dose'],
  run(v,el){if((v.du==='kgmin'||v.du==='kgh')&&v.wt==null)return{miss:['wt']};
   const conc=v.amt/v.vol,perh=v.du==='kgmin'?v.dose*60*v.wt:v.du==='kgh'?v.dose*v.wt:v.du==='day'?v.dose/24:v.dose,rate=perh/conc;
   const p=el&&el._preset,w=[];let tone='prio';
   if(p){if(v.u!==p.u)w.push('Đơn vị lượng thuốc ('+v.u+') khác đơn vị chuẩn của thuốc này ('+p.u+').');if(v.du!==p.du)w.push('Kiểu liều khác kiểu chuẩn của mẫu thuốc.');
    if(v.u===p.u&&v.du===p.du){if(v.dose>p.max){w.push('Liều vượt mức tối đa tham khảo ('+p.max+').');tone='dang';}else if(v.dose<p.min){w.push('Liều thấp hơn khoảng thường dùng ('+p.min+').');tone='caut';}else if(p.hi&&v.dose>p.hi){w.push('Liều cao (> '+p.hi+') – đánh giá lại.');tone='caut';}}
    if(p.cmax&&conc*1000>p.cmax&&v.u==='mmol'){w.push('Nồng độ '+fmt(conc*1000)+' mmol/L > '+p.cmax+' mmol/L: chỉ dùng đường trung tâm.');if(tone==='prio')tone='caut';}}
   if(v.vol>60)w.push('Thể tích > 60 mL: thường dùng máy truyền dịch thay bơm tiêm 50 mL.');
   if(rate>100){w.push('Tốc độ > 100 mL/giờ: kiểm tra lại nồng độ/đơn vị.');tone='dang';}if(rate<0.1){w.push('Tốc độ < 0,1 mL/giờ: nồng độ quá đặc – pha loãng hơn.');tone='caut';}
   return{big:fmt(rate,2)+' mL/giờ',lab:'Tốc độ bơm',tone,txt:'Nồng độ '+fmt(conc,3)+' '+v.u+'/mL · liều '+fmt(perh,2)+' '+v.u+'/giờ · bơm '+v.vol+' mL chạy hết sau ≈ '+fmt(v.vol/rate,1)+' giờ.',warn:w}}}
};
/* Công cụ tính bổ sung: Light, Polymyxin, Vancomycin AUC */
const COL_T=[[90,360],[80,340],[70,300],[60,275],[50,245],[40,220],[30,195],[20,175],[10,160],[5,145],[0,130]];
Object.assign(CALCS,{
 light:{name:'Tiêu chuẩn Light (dịch thấm / dịch tiết)',src:'Light RW et al. Ann Intern Med 1972. BTS 2023: dùng Light khi chọc dò chẩn đoán; suy tim đã dùng lợi tiểu → chênh lệch albumin máu – dịch.',
  f:[{k:'pf',l:'Protein dịch (g/L)',t:'num',min:0,max:120},{k:'ps',l:'Protein máu (g/L)',t:'num',min:20,max:150},{k:'lf',l:'LDH dịch (U/L)',t:'num',min:0,max:50000},{k:'ls',l:'LDH máu (U/L)',t:'num',min:20,max:10000},{k:'uln',l:'Giới hạn trên bình thường LDH máu (U/L)',t:'num',min:100,max:1000},{k:'af',l:'Albumin dịch (g/L) – tùy chọn',t:'num',min:0,max:60},{k:'as',l:'Albumin máu (g/L) – tùy chọn',t:'num',min:5,max:60},{k:'diu',l:'Suy tim đang dùng lợi tiểu',t:'ck'}],req:['pf','ps','lf','ls','uln'],
  run(v){const r1=v.pf/v.ps,r2=v.lf/v.ls,r3=v.lf/v.uln,c=[r1>0.5,r2>0.6,r3>2/3],n=c.filter(Boolean).length,ex=n>0,w=[];

 colis:{name:'Liều polymyxin (colistin – CMS / polymyxin B)',src:'International Consensus Guidelines on Polymyxins (Tsuji BT et al. Pharmacotherapy 2019). Quy đổi: 1 MIU CMS ≈ 33 mg CBA ≈ 80 mg CMS. Polymyxin B: 1 mg = 10.000 IU. CHỜ KIỂM DUYỆT – hội chẩn dược.',

 vauc:{name:'Vancomycin AUC₂₄ (2 nồng độ – Sawchuk-Zaske)',src:'Rybak MJ et al. AJHP 2020: mục tiêu AUC₂₄/MIC 400–600 (MIC 1) cho MRSA nặng. Chỉ dùng ở trạng thái ổn định, 2 mẫu cùng một khoảng liều sau khi truyền xong.',
  f:[{k:'dose',l:'Liều mỗi lần (mg)',t:'num',min:250,max:4000},{k:'tau',l:'Khoảng liều (giờ)',t:'num',min:6,max:48},{k:'ti',l:'Thời gian truyền (giờ)',t:'num',min:0.5,max:4},{k:'c1',l:'Nồng độ 1 – sau truyền (mg/L)',t:'num',min:1,max:100},{k:'t1',l:'Thời điểm mẫu 1 tính từ KẾT THÚC truyền (giờ)',t:'num',min:0,max:24},{k:'c2',l:'Nồng độ 2 (mg/L)',t:'num',min:0.5,max:100},{k:'t2',l:'Thời điểm mẫu 2 tính từ kết thúc truyền (giờ)',t:'num',min:0.5,max:48},{k:'tg',l:'AUC mục tiêu',t:'num',min:400,max:600}],req:['dose','tau','ti','c1','t1','c2','t2'],
  run(v){if(!(v.c1>v.c2)||!(v.t2>v.t1))return{big:'—',lab:'Dữ liệu không phù hợp',tone:'dang',txt:'Cần nồng độ 1 > nồng độ 2 và mẫu 2 lấy sau mẫu 1.'};

   const ke=Math.log(v.c1/v.c2)/(v.t2-v.t1),cmax=v.c1*Math.exp(ke*v.t1),cmin=v.c2*Math.exp(-ke*(v.tau-v.ti-v.t2)),auc=(v.ti*(cmax+cmin)/2+(cmax-cmin)/ke)*24/v.tau,tg=v.tg||500,nd=v.dose*tg/auc,w=[];
   const tone=auc<400?'caut':auc>600?'dang':'prio';if(auc>600)w.push('AUC > 600: tăng nguy cơ độc thận – giảm liều.');if(auc<400)w.push('AUC < 400: có thể chưa đủ hiệu quả.');
   w.push('Kiểm tra lại giờ lấy mẫu; không dùng khi chức năng thận đang thay đổi nhanh (tổn thương thận cấp) – hội chẩn dược.');
   return{big:fmt(auc,0)+' mg·giờ/L',lab:'AUC₂₄ ước tính',big2:fmt(Math.round(nd/250)*250,0)+' mg mỗi '+v.tau+' giờ',lab2:'Liều gợi ý để đạt AUC '+tg+' (làm tròn 250 mg)',tone,
    txt:'ke '+fmt(ke,3)+'/giờ · t½ '+fmt(Math.LN2/ke,1)+' giờ · Cmax '+fmt(cmax,1)+' · Cmin '+fmt(cmin,1)+' mg/L. Liều mới = liều × mục tiêu/AUC (động học tuyến tính) – chỉ gợi ý, bác sĩ quyết định.',warn:w}}}

Object.assign(CALCS,{
 insdm:{name:'Insulin ngoại trú (bắt đầu và chỉnh liều)',src:'ADA Standards of Care 2026 (Mục 9): khởi đầu nền 10 đơn vị hoặc 0,1–0,2 đơn vị/kg; chỉnh 2 đơn vị mỗi 3 ngày đến glucose đói 4,4–7,2 mmol/L; hạ đường huyết giảm 10–20%. Gợi ý – bác sĩ quyết định.',
  f:[{k:'mode',l:'Tình huống',t:'sel',o:[['','— chọn —'],['1','Bắt đầu insulin nền'],['2','Chỉnh liều insulin nền'],['3','Bắt đầu basal-bolus'],['4','Chuyển nền → trộn sẵn 2 mũi']]},{k:'wt',l:'Cân nặng (kg)',t:'num',min:30,max:250},{k:'risk',l:'Cao tuổi / suy thận / nguy cơ hạ đường huyết',t:'ck'},{k:'dose',l:'Liều insulin nền hiện tại (đơn vị/ngày)',t:'num',min:1,max:300},{k:'fbg',l:'Glucose đói trung bình 3 ngày gần nhất (mmol/L)',t:'num',min:1,max:40},{k:'hypo',l:'Có glucose < 3,9 mmol/L trong tuần',t:'ck'}],req:['mode'],
  run(v){const w=[];
   if(v.mode===1){if(v.wt==null)return{big:'10 đơn vị/ngày',lab:'Insulin nền khởi đầu (không cân nặng)',tone:'prio',txt:'Tiêm cùng giờ mỗi ngày (NPH trước ngủ). Chỉnh 2 đơn vị mỗi 3 ngày.'};
    const lo=v.risk?0.1:0.1,hi=v.risk?0.1:0.2;return{big:fmt(lo*v.wt,0)+(hi>lo?'–'+fmt(hi*v.wt,0):'')+' đơn vị/ngày',lab:'Insulin nền khởi đầu ('+(v.risk?'0,1':'0,1–0,2')+' đơn vị/kg)',tone:'prio',txt:'Hoặc 10 đơn vị/ngày. Giữ metformin ± SGLT2i/GLP-1 RA; giảm/ngừng sulfonylurê. Chỉnh 2 đơn vị mỗi 3 ngày theo glucose đói.',warn:v.risk?['Nguy cơ cao: bắt đầu thấp, đích glucose đói nới (≤ 8,3 mmol/L).']:[]};}
   if(v.mode===2){if(v.dose==null||v.fbg==null)return{miss:[v.dose==null?'dose':'fbg']};
    let nd=v.dose,act,tone='prio';const tgHi=v.risk?8.3:7.2;
    if(v.hypo||v.fbg<4.4){nd=Math.round(v.dose*(v.hypo?0.85:0.9));act='Giảm 10–20% (hạ đường huyết/glucose đói thấp)';tone='dang';}
    else if(v.fbg>tgHi){nd=v.dose+2;act='Tăng 2 đơn vị (đánh giá lại sau 3 ngày)';tone='caut';}else act='Giữ liều – đã đạt mục tiêu';
    if(v.wt!=null&&nd/v.wt>0.5)w.push('Liều nền > 0,5 đơn vị/kg/ngày: nghĩ "quá nền" – thêm GLP-1 RA hoặc insulin bữa ăn thay vì tăng tiếp.');
    return{big:nd+' đơn vị/ngày',lab:act,tone,txt:'Đích glucose đói 4,4–'+fmt(tgHi,1)+' mmol/L. Liều hiện tại '+v.dose+' đơn vị'+(v.wt?(' = '+fmt(v.dose/v.wt,2)+' đơn vị/kg'):'')+'.',warn:w};}
   if(v.mode===3){if(v.wt==null)return{miss:['wt']};const f=v.risk?0.3:0.4,t=f*v.wt,b=t/2,m=t/6;
    return{big:fmt(t,0)+' đơn vị/ngày',lab:'Tổng liều basal-bolus ('+fmt(f,1)+' đơn vị/kg; khoảng 0,3–0,5)',big2:'Nền '+fmt(b,0)+' · mỗi bữa '+fmt(m,0)+' đơn vị',lab2:'Chia 50% nền / 50% chia 3 bữa',tone:'caut',txt:'Chỉnh nền theo glucose đói; chỉnh liều bữa theo glucose trước bữa kế tiếp, 1–2 đơn vị mỗi 3 ngày.',warn:['Ngừng sulfonylurê.']};}
   if(v.mode===4){if(v.dose==null)return{miss:['dose']};const a=Math.round(v.dose*2/3),p=v.dose-a,a2=Math.round(v.dose/2);
    return{big:a+' đơn vị sáng · '+p+' đơn vị tối',lab:'Trộn sẵn 30/70: 2/3 sáng – 1/3 tối',big2:a2+' · '+(v.dose-a2)+' đơn vị',lab2:'Hoặc chia 1/2 – 1/2',tone:'caut',txt:'Tiêm trước ăn sáng và tối (người: 30 phút; analog: 0–10 phút). Chỉnh 1–2 đơn vị (10–15%) mỗi 3–7 ngày: sáng theo glucose trước ăn tối, tối theo glucose đói.',warn:['Ngừng sulfonylurê; bữa ăn phải đều.','Cách chia theo ADA (sơ đồ tăng cường insulin) – chờ kiểm duyệt.']};}}},
 dkalab:{name:'Anion gap – Na hiệu chỉnh – Áp lực thẩm thấu (DKA/HHS)',src:'Anion gap = Na − (Cl + HCO3) (bình thường ≤ 12 khi không tính K). Na hiệu chỉnh: +1,6 mmol/L (Katz) hoặc +2,4 (Hillier) mỗi 5,6 mmol/L glucose trên 5,6. Áp lực thẩm thấu hiệu dụng = 2Na + glucose; toàn phần = 2Na + glucose + ure (mmol/L). Tiêu chuẩn: đồng thuận 2024.',
  f:[{k:'na',l:'Na (mmol/L)',t:'num',min:100,max:190},{k:'cl',l:'Cl (mmol/L)',t:'num',min:60,max:150},{k:'hco3',l:'HCO3 (mmol/L)',t:'num',min:1,max:45},{k:'glu',l:'Glucose (mmol/L)',t:'num',min:1,max:150},{k:'ure',l:'Ure (mmol/L) – tùy chọn',t:'num',min:0.5,max:80},{k:'bhb',l:'β-OHB máu (mmol/L) – tùy chọn',t:'num',min:0,max:15},{k:'ph',l:'pH tĩnh mạch – tùy chọn',t:'num',min:6.5,max:7.7}],req:['na','glu'],
  run(v){const w=[],e=2*v.na+v.glu,ex=(v.glu-5.6)/5.6,c1=v.na+1.6*ex,c2=v.na+2.4*ex;let txt='Na hiệu chỉnh '+fmt(c1,1)+' (hệ số 1,6) – '+fmt(c2,1)+' mmol/L (hệ số 2,4).';

   let o={big:fmt(e,0)+' mOsm/kg',lab:'Áp lực thẩm thấu hiệu dụng (2Na + glucose)',tone:e>320?'dang':e>300?'caut':'prio'};
   if(v.ure!=null){o.big2=fmt(e+v.ure,0)+' mOsm/kg';o.lab2='Áp lực thẩm thấu toàn phần (+ ure)';}
   const keto=v.bhb!=null?v.bhb>=3:null,acid=(v.ph!=null&&v.ph<7.3)||(v.hco3!=null&&v.hco3<18),hyper=e>300||(v.ure!=null&&e+v.ure>320);
   if(keto&&acid&&(v.glu>=11.1))w.push('Đủ tiêu chuẩn DKA (glucose ≥ 11,1 + β-OHB ≥ 3,0 + toan).');

   if(v.glu>=33.3&&hyper&&keto===false&&!acid)w.push('Phù hợp HHS (glucose ≥ 33,3, tăng áp lực thẩm thấu, không toan ceton).');
   if(v.glu>=33.3&&hyper&&(keto||acid))w.push('Gợi ý HHS PHỐI HỢP DKA.');
   if(v.glu>=33.3&&hyper&&keto===null)w.push('Cần β-OHB/pH để phân biệt HHS với DKA.');
   if(c1>=145)w.push('Na hiệu chỉnh tăng: mất nước tự do nặng – điều chỉnh chậm (Na giảm ≤ 10 mmol/L/24 giờ).');
   o.txt=txt+' Glucose '+fmt(v.glu,1)+' mmol/L = '+fmt(MG(v.glu),0)+' mg/dL.';o.warn=w;return o}},
 dkains:{name:'Insulin truyền TM (DKA/HHS) – bơm tiêm điện',src:'Đồng thuận 2024: DKA 0,1 đơn vị/kg/giờ → 0,05 khi glucose < 13,9 mmol/L (thêm glucose 5–10%); HHS 0,05; HHS + DKA 0,1. Kali < 3,5 mmol/L: chưa truyền insulin.',
  f:[{k:'ty',l:'Tình trạng',t:'sel',o:[['','— chọn —'],['1','DKA'],['2','HHS đơn thuần'],['3','HHS + DKA']]},{k:'wt',l:'Cân nặng (kg)',t:'num',min:30,max:250},{k:'k',l:'Kali máu (mmol/L)',t:'num',min:1.5,max:9},{k:'glu',l:'Glucose hiện tại (mmol/L)',t:'num',min:1,max:150},{k:'conc',l:'Nồng độ pha (đơn vị/mL)',t:'num',min:0.1,max:2,presets:[['1','50 đv/50 mL'],['0.5','25 đv/50 mL']]}],req:['ty','wt','k','glu'],
  run(v){const conc=v.conc||1,w=[];

   let r=v.ty===2?0.05:0.1;if(v.glu<13.9)r=0.05;const uh=r*v.wt,ml=uh/conc;
   if(v.glu<13.9)w.push('Glucose < 13,9: đã giảm còn 0,05 đơn vị/kg/giờ – THÊM glucose 5–10%; không ngừng insulin khi còn nhiễm toan.');
   if(v.k<=5)w.push('K '+fmt(v.k,1)+': thêm 20–30 mmol KCl mỗi lít dịch.');else w.push('K > 5,0: chưa bù kali, kiểm tra lại sau 2 giờ.');

 kdka:{name:'Bù kali trong DKA/HHS',src:'Đồng thuận 2024: K < 3,5 → 10 mmol/giờ, hoãn insulin; K 3,5–5,0 → 20–30 mmol mỗi lít dịch; K > 5,0 → chưa bù. KCl 10%: 1 g/10 mL ≈ 13,4 mmol K.',

/* ===================== ỨNG DỤNG ===================== */
const DB=D;

try{const r=localStorage.getItem('nth_v2');if(r)store=Object.assign(store,JSON.parse(r));}catch(e){}

const ALL=[];for(const g of GROUPS)for(const [id,name,src] of CATALOG[g.id])ALL.push({id,name,src,g:g.id});

/* ---------- lựa chọn tình trạng ---------- */
const stDef=(d,id)=>d.states.find(s=>s.id===id);
function removeCascade(d,set,id,n){if(!set.has(id))return;set.delete(id);for(const s of d.states)if((s.imp||[]).includes(id)&&set.has(s.id)){n.push('bỏ "'+s.l+'"');removeCascade(d,set,s.id,n);}}
function addSt(d,set,id,n){const s=stDef(d,id);if(!s||set.has(id))return;
 if(s.x)for(const o of d.states)if(o.x===s.x&&o.id!==id&&set.has(o.id)){n.push('bỏ "'+o.l+'"');removeCascade(d,set,o.id,n);}
 set.add(id);for(const i of s.imp||[])if(!set.has(i)){const t=stDef(d,i);addSt(d,set,i,n);if(t)n.push('tự chọn "'+t.l+'"');}}
function toggleSt(id){const d=DB[cur],set=S(),n=[];if(set.has(id))removeCascade(d,set,id,n);else addSt(d,set,id,n);if(n.length)toast('Đã '+[...new Set(n)].join(', ')+'.');render();}

/* ---------- phác đồ đang áp dụng ---------- */
function activeRegs(d){const set=S();return d.regs.filter(r=>{let ok=false;try{ok=r.w(set)}catch(e){}return ok||(set.size===0&&r.def);}).sort((a,b)=>(a.t==='dang'?0:1)-(b.t==='dang'?0:1));}
const needs=d=>(d.need||[]).filter(n=>{try{return n.w(S())}catch(e){return false}});
function flatLines(lines){const out=[];for(const it of lines||[]){if(it.or)for(const o of it.or){if(Array.isArray(o))out.push(...o);else out.push(o);}else out.push(it);}return out;}
function drugKeys(regs){const s=new Set();for(const r of regs)for(const l of flatLines(r.lines))if(DRUG[l.d])s.add(l.d);return[...s];}

 if(cur&&cur!==id&&!o.back)navStack.push(cur);cur=id;view=o.view||(DB[id]&&DB[id].defView)||'all';hlDrug=o.drug||null;
 const it=ALL.find(x=>x.id===id)||(DB[id]&&{g:DB[id].g});if(it)openGroups.add(it.g);
 store.hist=[id,...store.hist.filter(x=>x!==id)].slice(0,8);store.cnt[id]=(store.cnt[id]||0)+1;save();
 try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}catch(e){}
 $('#side').classList.remove('on');$('#scrim').classList.remove('on');render();window.scrollTo({top:0,behavior:'smooth'});}

function renderSide(){const freq=Object.entries(store.cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(id=>DB[id]||ALIAS[id]);
 const common=[...new Set([...freq,'pud','hp','cirr','cap','uti','hyperk','t2d'])].slice(0,8);

function lineRow(l,mark,deep){const x=DRUG[l.d]||{n:l.d};
 let h='<tr class="ln"><td class="dn">'+(mark?'<span class="mk">'+mark+'</span>':'')+'<button class="dname" data-act="gotodrug" data-id="'+esc(l.d)+'">'+esc(x.n)+'</button>'+(l.opt?'<span class="opt-t">tùy chọn</span>':'')+(deep&&x.f?'<div class="frm">'+esc(x.f)+'</div>':'')+'</td>'+

 if(l.note)h+='<tr class="nt"><td colspan="5">'+ic('i-info','sm')+esc(l.note)+'</td></tr>';
 if(deep){const p=[];const ok=v=>v&&v!=='—';if(ok(x.max))p.push('<b>Tối đa:</b> '+esc(x.max));if(ok(x.renal))p.push('<b>Thận:</b> '+esc(x.renal));if(ok(x.hep))p.push('<b>Gan:</b> '+esc(x.hep));if(ok(x.ci))p.push('<b class="dg">CCĐ:</b> '+esc(x.ci));
  if(p.length)h+='<tr class="dp"><td colspan="5">'+p.join(' · ')+'</td></tr>';}
 return h;}
function linesTable(lines,deep){if(!lines||!lines.length)return'';let h='<div class="rxw"><table class="rx"><thead><tr><th>Thuốc (hoạt chất)</th><th>Liều mỗi lần</th><th>Đường dùng</th><th>Số lần · thời điểm</th><th>Thời gian</th></tr></thead><tbody>';
 for(const it of lines){if(it.or){h+='<tr class="orh"><td colspan="5">'+ic('i-swap','sm')+'Chọn MỘT trong các lựa chọn sau – không dùng đồng thời</td></tr>';
   it.or.forEach((o,i)=>{const tag=i?'HOẶC':'';if(Array.isArray(o))o.forEach((x,j)=>{h+=lineRow(x,j?'+':tag,deep);});else h+=lineRow(o,tag,deep);});h+='<tr class="ore"><td colspan="5"></td></tr>';}
  else h+=lineRow(it,'',deep);}
 return h+'</tbody></table></div>';}
function linesText(lines){const t=[];const one=x=>{const d=DRUG[x.d]||{n:x.d};return d.n+': '+x.dose+' · '+x.route+' · '+x.freq+' · '+x.dur+(x.note?' ('+x.note+')':'');};
 for(const it of lines||[]){if(it.or){t.push('Chọn MỘT:');it.or.forEach((o,i)=>{t.push('  '+(i?'HOẶC ':'')+(Array.isArray(o)?o.map(one).join(' + '):one(o)));});}else t.push('- '+one(it));}return t.join('\n');}

function calcHTML(id,open){const c=CALCS[id];
 const fld=f=>f.t==='ck'?'<label class="ck"><input type="checkbox" name="'+f.k+'">'+esc(f.l)+'</label>':f.t==='sel'?'<div class="fld"><label>'+esc(f.l)+'</label><select name="'+f.k+'">'+f.o.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select></div>':'<div class="fld"><label>'+esc(f.l)+'</label>'+(f.pm?'<div class="pmw"><button type="button" class="pmb" data-act="pm" data-k="'+f.k+'" data-d="-'+f.pm+'">−</button>':'')+'<input type="number" inputmode="decimal" step="'+(f.step||'any')+'" name="'+f.k+'">'+(f.pm?'<button type="button" class="pmb" data-act="pm" data-k="'+f.k+'" data-d="'+f.pm+'">+</button></div>':'')+'</div>';
 const pre=c.presets?'<div class="chips" style="margin-bottom:10px">'+c.presets.map((p,i)=>p.c.map((cc,j)=>'<button class="chip" style="min-height:36px;padding:4px 10px;font-size:13px" data-act="preset" data-c="'+id+'" data-i="'+i+'" data-j="'+j+'">'+esc(p.n)+' · '+esc(cc[2])+'</button>').join('')).join('')+'</div>':'';
 return'<details class="calc" data-calc="'+id+'"'+(open?' open':'')+'><summary>'+ic('i-calc','sm')+esc(c.name)+'<span class="r"></span></summary><div class="cb"><div>'+pre+'<div class="fgrid">'+c.f.map(fld).join('')+'</div>'+(c.note?'<p class="src" style="margin-top:8px">'+esc(c.note)+'</p>':'')+'</div><div class="res"><span class="lab">Kết quả</span><p class="empty">Nhập thông số để tính.</p></div><p class="src">Nguồn: '+esc(c.src)+'</p></div></details>';}
function runCalc(el){const id=el.dataset.calc,c=CALCS[id],v={},bad=[];
 for(const f of c.f){const inp=el.querySelector('[name="'+f.k+'"]');if(!inp)continue;
  if(f.t==='ck')v[f.k]=inp.checked;else if(inp.value==='')v[f.k]=null;else{const n=Number(inp.value);v[f.k]=isNaN(n)?inp.value:n;if(f.t==='num'&&(isNaN(n)||(f.min!=null&&n<f.min)||(f.max!=null&&n>f.max))){bad.push(f.l+' (khoảng hợp lý '+f.min+'–'+f.max+')');}}}
 const box=el.querySelector('.res'),sum=el.querySelector('summary .r');box.className='res';box.style.background='';
 if(bad.length){box.className='res t-dang';box.style.background='var(--tb)';box.innerHTML='<span class="lab">Dữ liệu không hợp lệ</span><p>'+bad.map(esc).join('<br>')+'</p>';sum.textContent='';return;}
 const miss=(c.req||[]).filter(k=>v[k]==null);if(miss.length){box.innerHTML='<span class="lab">Kết quả</span><p class="empty">Cần nhập: '+esc(miss.map(k=>c.f.find(f=>f.k===k).l).join(', '))+'. Không tự suy diễn thông số thiếu.</p>';sum.textContent='';return;}
 const r=c.run(v,el);if(r.miss){box.innerHTML='<span class="lab">Kết quả</span><p class="empty">Cần nhập: '+esc(r.miss.map(k=>c.f.find(f=>f.k===k).l).join(', '))+'.</p>';sum.textContent='';return;}
 if(r.table){box.innerHTML='<span class="lab">Theo cân nặng '+esc(v.wt)+' kg</span><table class="tbl">'+r.table.map(x=>'<tr><td>'+esc(x[0])+'</td><td style="text-align:right;white-space:nowrap"><b>'+esc(x[1])+'</b></td></tr>').join('')+'</table>';sum.textContent=v.wt+' kg';return;}
 box.className='res t-'+r.tone;box.style.background='var(--tb)';
 box.innerHTML='<span class="lab">'+esc(r.lab)+'</span><span class="big" style="color:var(--tc)">'+esc(r.big)+'</span>'+(r.big2?'<span class="lab">'+esc(r.lab2)+'</span><span class="big" style="color:var(--tc);font-size:28px">'+esc(r.big2)+'</span>':'')+'<p>'+esc(r.txt)+'</p>'+(r.warn&&r.warn.length?'<ul class="wl">'+r.warn.map(w=>'<li>'+ic('i-alert','sm')+esc(w)+'</li>').join('')+'</ul>':'');sum.textContent=r.lab+': '+r.big;}

 else if(a==='copy')copyText(protocolText(),'Đã sao chép toàn bộ phác đồ.');
 else if(a==='print')doPrint();
 else if(a==='doprint'){try{window.print();}catch(err){toast('Dùng Ctrl/⌘ + P.');}}
 else if(a==='fav'){store.fav=store.fav.includes(cur)?store.fav.filter(x=>x!==cur):[cur,...store.fav];save();render();}
 else if(a==='back'){const p=navStack.pop();if(p)openDisease(p,{back:1});}
 else if(a==='fopt'){const i=+b.dataset.i;flows[cur]=flows[cur].slice(0,i+1).concat(b.dataset.n);renderMain();const el=document.getElementById('fn-'+(i+1));if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
 else if(a==='fjump'){const el=document.getElementById('fn-'+b.dataset.i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
 else if(a==='freset'){flows[cur]=null;renderMain();}
 else if(a==='fapply'){const d=DB[cur],set=S(),n=[];for(const s of new Set(flows[cur].flatMap(x=>d.flow.n[x].set||[])))addSt(d,set,s,n);view='all';toast('Đã áp dụng lựa chọn từ sơ đồ.');render();}
 else if(a==='preset'){const c=CALCS[b.dataset.c],p=c.presets[+b.dataset.i],cc=p.c[+b.dataset.j],el=b.closest('details.calc');el._preset=p;
  const set=(k,v)=>{const inp=el.querySelector('[name="'+k+'"]');if(inp)inp.value=v;};if(b.dataset.c==='adr'){set('amp',cc[0]);set('vol',cc[1]);if(!el.querySelector('[name=dose]').value)set('dose','0.1');}else{set('amt',cc[0]);set('vol',cc[1]);set('u',p.u);set('du',p.du);set('dose',p.dose);}runCalc(el);toast(p.n+': '+cc[2]+(p.note?' – '+p.note:''));}
 else if(a==='pm'){const el=b.closest('details.calc'),inp=el.querySelector('[name="'+b.dataset.k+'"]');const v=Math.max(0.01,Math.round(((Number(inp.value)||0)+Number(b.dataset.d))*100)/100);inp.value=v;runCalc(el);}
 else if(a==='adrlog'){const d=Number($('#adrDose').value);adrLog.push({t:Date.now(),d});adrIntv=Number($('#adrInt').value);renderTimer();}
 else if(a==='adrundo'){adrLog.pop();renderTimer();}
 else if(a==='adrreset'){adrLog=[];renderTimer();}
 else if(a==='bglog'){const v=Number($('#bgVal').value);if(!$('#bgVal').value||!(v>=0.5&&v<=60)){toast('Nhập glucose hợp lệ 0,5–60 mmol/L');return;}bgIntv=Number($('#bgInt').value);bgLog.push({t:Date.now(),v,i:bgIntv});renderBG();}
 else if(a==='bgundo'){bgLog.pop();renderBG();}
 else if(a==='bgreset'){bgLog=[];renderBG();}
 else if(a==='tools')openTools();
 else if(a==='mclose')$('#modal').classList.remove('on');
 else if(a==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark';store.theme=r.dataset.theme;save();}
 else if(a==='menu'){$('#side').classList.toggle('on');$('#scrim').classList.toggle('on');}
 else if(a==='sgo')sGo(+b.dataset.i);
});
document.addEventListener('input',e=>{const c=e.target.closest('details.calc');if(c)runCalc(c);if(e.target.id==='q')renderSearch();});
document.addEventListener('change',e=>{const c=e.target.closest('details.calc');if(c)runCalc(c);});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.calc')&&e.target.open)runCalc(e.target);},true);
$('#q').addEventListener('keydown',e=>{const bs=[...document.querySelectorAll('#sres button')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;sK=(sK+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((x,i)=>x.classList.toggle('k',i===sK));}else if(e.key==='Enter'){e.preventDefault();sGo(sK);}else if(e.key==='Escape')$('#sres').classList.remove('on');});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').classList.remove('on');},true);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on');if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus();}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&ALL.some(x=>x.id===h))openDisease(h);});
if(store.theme)document.documentElement.dataset.theme=store.theme;
{const h=(location.hash||'').slice(1);openDisease(ALL.some(x=>x.id===h)?h:(store.hist[0]&&ALL.some(x=>x.id===store.hist[0])?store.hist[0]:'pud'));navStack=[];render();}
})();
</script>
</body></html>
