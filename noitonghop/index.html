Object.assign(CALCS,{
 insdm:{name:'Insulin ngoại trú (bắt đầu và chỉnh liều)',src:'ADA Standards of Care 2026 (Mục 9): khởi đầu nền 10 đơn vị hoặc 0,1–0,2 đơn vị/kg; chỉnh 2 đơn vị mỗi 3 ngày đến glucose đói 4,4–7,2 mmol/L; hạ đường huyết giảm 10–20%. Gợi ý – bác sĩ quyết định.',
  f:[{k:'mode',l:'Tình huống',t:'sel',o:[['','— chọn —'],['1','Bắt đầu insulin nền'],['2','Chỉnh liều insulin nền'],['3','Bắt đầu basal-bolus'],['4','Chuyển nền → trộn sẵn 2 mũi']]},{k:'wt',l:'Cân nặng (kg)',t:'num',min:30,max:250},{k:'risk',l:'Cao tuổi / suy thận / nguy cơ hạ đường huyết',t:'ck'},{k:'dose',l:'Liều insulin nền hiện tại (đơn vị/ngày)',t:'num',min:1,max:300},{k:'fbg',l:'Glucose đói trung bình 3 ngày gần nhất (mmol/L)',t:'num',min:1,max:40},{k:'hypo',l:'Có glucose < 3,9 mmol/L trong tuần',t:'ck'}],req:['mode'],
  run(v){const w=[];
   if(v.mode===1){if(v.wt==null)return{big:'10 đơn vị/ngày',lab:'Insulin nền khởi đầu (không cân nặng)',tone:'prio',txt:'Tiêm cùng giờ mỗi ngày (NPH trước ngủ). Chỉnh 2 đơn vị mỗi 3 ngày.'};
    const lo=v.risk?0.1:0.1,hi=v.risk?0.1:0.2;return{big:fmt(lo*v.wt,0)+(hi>lo?'–'+fmt(hi*v.wt,0):'')+' đơn vị/ngày',lab:'Insulin nền khởi đầu ('+(v.risk?'0,1':'0,1–0,2')+' đơn vị/kg)',tone:'prio',txt:'Hoặc 10 đơn vị/ngày. Giữ metformin ± SGLT2i/GLP-1 RA; giảm/ngừng sulfonylurê. Chỉnh 2 đơn vị mỗi 3 ngày theo glucose đói.',warn:v.risk?['Nguy cơ cao: bắt đầu thấp, đích glucose đói nới (≤ 8,3 mmol/L).']:[]};}
   if(v.mode===2){if(v.dose==null||v.fbg==null)return{miss:[v.dose==null?'dose':'fbg']};
    let nd=v.dose,act,tone='prio';const tgHi=v.risk?8.3:7.2;
    if(v.hypo||v.fbg<4.4){nd=Math.round(v.dose*(v.hypo?0.85:0.9));act='Giảm 10–20% (hạ đường huyết/glucose đói thấp)';tone='dang';}
    else if(v.fbg>tgHi){nd=v.dose+2;act='Tăng 2 đơn vị (đánh giá lại sau 3 ngày)';tone='caut';}else act='Giữ liều – đã đạt mục tiêu';
    if(v.wt!=null&&nd/v.wt>0.5)w.push('Liều nền > 0,5 đơn vị/kg/ngày: nghĩ "quá nền" – thêm GLP-1 RA hoặc insulin bữa ăn thay vì tăng tiếp.');
    return{big:nd+' đơn vị/ngày',lab:act,tone,txt:'Đích glucose đói 4,4–'+fmt(tgHi,1)+' mmol/L. Liều hiện tại '+v.dose+' đơn vị'+(v.wt?(' = '+fmt(v.dose/v.wt,2)+' đơn vị/kg'):'')+'.',warn:w};}
   if(v.mode===3){if(v.wt==null)return{miss:['wt']};const f=v.risk?0.3:0.4,t=f*v.wt,b=t/2,m=t/6;
    return{big:fmt(t,0)+' đơn vị/ngày',lab:'Tổng liều basal-bolus ('+fmt(f,1)+' đơn vị/kg; khoảng 0,3–0,5)',big2:'Nền '+fmt(b,0)+' · mỗi bữa '+fmt(m,0)+' đơn vị',lab2:'Chia 50% nền / 50% chia 3 bữa',tone:'caut',txt:'Chỉnh nền theo glucose đói; chỉnh liều bữa theo glucose trước bữa kế tiếp, 1–2 đơn vị mỗi 3 ngày.',warn:['Ngừng sulfonylurê.']};}
   if(v.mode===4){if(v.dose==null)return{miss:['dose']};const a=Math.round(v.dose*2/3),p=v.dose-a,a2=Math.round(v.dose/2);
    return{big:a+' đơn vị sáng · '+p+' đơn vị tối',lab:'Trộn sẵn 30/70: 2/3 sáng – 1/3 tối',big2:a2+' · '+(v.dose-a2)+' đơn vị',lab2:'Hoặc chia 1/2 – 1/2',tone:'caut',txt:'Tiêm trước ăn sáng và tối (người: 30 phút; analog: 0–10 phút). Chỉnh 1–2 đơn vị (10–15%) mỗi 3–7 ngày: sáng theo glucose trước ăn tối, tối theo glucose đói.',warn:['Ngừng sulfonylurê; bữa ăn phải đều.','Cách chia theo ADA (sơ đồ tăng cường insulin) – chờ kiểm duyệt.']};}}},
 dkalab:{name:'Anion gap – Na hiệu chỉnh – Áp lực thẩm thấu (DKA/HHS)',src:'Anion gap = Na − (Cl + HCO3) (bình thường ≤ 12 khi không tính K). Na hiệu chỉnh: +1,6 mmol/L (Katz) hoặc +2,4 (Hillier) mỗi 5,6 mmol/L glucose trên 5,6. Áp lực thẩm thấu hiệu dụng = 2Na + glucose; toàn phần = 2Na + glucose + ure (mmol/L). Tiêu chuẩn: đồng thuận 2024.',
  f:[{k:'na',l:'Na (mmol/L)',t:'num',min:100,max:190},{k:'cl',l:'Cl (mmol/L)',t:'num',min:60,max:150},{k:'hco3',l:'HCO3 (mmol/L)',t:'num',min:1,max:45},{k:'glu',l:'Glucose (mmol/L)',t:'num',min:1,max:150},{k:'ure',l:'Ure (mmol/L) – tùy chọn',t:'num',min:0.5,max:80},{k:'bhb',l:'β-OHB máu (mmol/L) – tùy chọn',t:'num',min:0,max:15},{k:'ph',l:'pH tĩnh mạch – tùy chọn',t:'num',min:6.5,max:7.7}],req:['na','glu'],
  run(v){const w=[],e=2*v.na+v.glu,ex=(v.glu-5.6)/5.6,c1=v.na+1.6*ex,c2=v.na+2.4*ex;let txt='Na hiệu chỉnh '+fmt(c1,1)+' (hệ số 1,6) – '+fmt(c2,1)+' mmol/L (hệ số 2,4).';
   if(v.cl!=null&&v.hco3!=null){const ag=v.na-v.cl-v.hco3;txt+=' Anion gap '+fmt(ag,0)+(ag>12?' (tăng)':'')+'.';}
   let o={big:fmt(e,0)+' mOsm/kg',lab:'Áp lực thẩm thấu hiệu dụng (2Na + glucose)',tone:e>320?'dang':e>300?'caut':'prio'};
   if(v.ure!=null){o.big2=fmt(e+v.ure,0)+' mOsm/kg';o.lab2='Áp lực thẩm thấu toàn phần (+ ure)';}
   const keto=v.bhb!=null?v.bhb>=3:null,acid=(v.ph!=null&&v.ph<7.3)||(v.hco3!=null&&v.hco3<18),hyper=e>300||(v.ure!=null&&e+v.ure>320);
   if(keto&&acid&&(v.glu>=11.1))w.push('Đủ tiêu chuẩn DKA (glucose ≥ 11,1 + β-OHB ≥ 3,0 + toan).');
   if(keto&&acid&&v.glu<11.1)w.push('Toan ceton với glucose < 11,1: nghĩ DKA BÌNH ĐƯỜNG HUYẾT (SGLT2i, có thai, nhịn đói).');
   if(v.glu>=33.3&&hyper&&keto===false&&!acid)w.push('Phù hợp HHS (glucose ≥ 33,3, tăng áp lực thẩm thấu, không toan ceton).');
   if(v.glu>=33.3&&hyper&&(keto||acid))w.push('Gợi ý HHS PHỐI HỢP DKA.');
   if(v.glu>=33.3&&hyper&&keto===null)w.push('Cần β-OHB/pH để phân biệt HHS với DKA.');
   if(c1>=145)w.push('Na hiệu chỉnh tăng: mất nước tự do nặng – điều chỉnh chậm (Na giảm ≤ 10 mmol/L/24 giờ).');
   o.txt=txt+' Glucose '+fmt(v.glu,1)+' mmol/L = '+fmt(MG(v.glu),0)+' mg/dL.';o.warn=w;return o}},
 dkains:{name:'Insulin truyền TM (DKA/HHS) – bơm tiêm điện',src:'Đồng thuận 2024: DKA 0,1 đơn vị/kg/giờ → 0,05 khi glucose < 13,9 mmol/L (thêm glucose 5–10%); HHS 0,05; HHS + DKA 0,1. Kali < 3,5 mmol/L: chưa truyền insulin.',
  f:[{k:'ty',l:'Tình trạng',t:'sel',o:[['','— chọn —'],['1','DKA'],['2','HHS đơn thuần'],['3','HHS + DKA']]},{k:'wt',l:'Cân nặng (kg)',t:'num',min:30,max:250},{k:'k',l:'Kali máu (mmol/L)',t:'num',min:1.5,max:9},{k:'glu',l:'Glucose hiện tại (mmol/L)',t:'num',min:1,max:150},{k:'conc',l:'Nồng độ pha (đơn vị/mL)',t:'num',min:0.1,max:2,presets:[['1','50 đv/50 mL'],['0.5','25 đv/50 mL']]}],req:['ty','wt','k','glu'],
  run(v){const conc=v.conc||1,w=[];
   if(v.k<3.5)return{big:'CHƯA TRUYỀN INSULIN',lab:'Kali '+fmt(v.k,1)+' < 3,5 mmol/L',tone:'dang',txt:'Bù KCl 10 mmol/giờ, kiểm tra K mỗi giờ; bắt đầu insulin khi K > 3,5 mmol/L.',warn:['Insulin khi hạ kali → nguy cơ loạn nhịp, ngừng tim.']};
   if(v.glu<3.9)return{big:'NGỪNG insulin, xử trí hạ đường huyết',lab:'Glucose '+fmt(v.glu,1)+' mmol/L',tone:'dang',txt:'Truyền glucose, kiểm tra lại sau 15 phút; khởi động lại insulin liều thấp khi glucose > 3,9 nếu còn nhiễm toan.'};
   let r=v.ty===2?0.05:0.1;if(v.glu<13.9)r=0.05;const uh=r*v.wt,ml=uh/conc;
   if(v.glu<13.9)w.push('Glucose < 13,9: đã giảm còn 0,05 đơn vị/kg/giờ – THÊM glucose 5–10%; không ngừng insulin khi còn nhiễm toan.');
   if(v.k<=5)w.push('K '+fmt(v.k,1)+': thêm 20–30 mmol KCl mỗi lít dịch.');else w.push('K > 5,0: chưa bù kali, kiểm tra lại sau 2 giờ.');
   if(v.ty!==1)w.push('HHS: glucose giảm ≤ 5 mmol/L/giờ; áp lực thẩm thấu 3–8 mOsm/kg/giờ.');
   if(v.wt>150)w.push('Cân nặng > 150 kg: kiểm tra lại (nhiều quy trình giới hạn liều tối đa).');
   return{big:fmt(ml,1)+' mL/giờ',lab:'Tốc độ bơm',big2:fmt(uh,1)+' đơn vị/giờ',lab2:fmt(r,2)+' đơn vị/kg/giờ × '+v.wt+' kg',tone:'spec',txt:'Nồng độ '+fmt(conc,2)+' đơn vị/mL. Kiểm tra glucose mỗi giờ.',warn:w}}},
 kdka:{name:'Bù kali trong DKA/HHS',src:'Đồng thuận 2024: K < 3,5 → 10 mmol/giờ, hoãn insulin; K 3,5–5,0 → 20–30 mmol mỗi lít dịch; K > 5,0 → chưa bù. KCl 10%: 1 g/10 mL ≈ 13,4 mmol K.',
  f:[{k:'k',l:'Kali máu (mmol/L)',t:'num',min:1.5,max:9},{k:'vol',l:'Thể tích chai dịch (mL)',t:'num',min:100,max:1000,presets:[['500','500 mL'],['1000','1000 mL']]},{k:'cvc',l:'Có đường truyền trung tâm + monitor',t:'ck'}],req:['k'],
  run(v){const amp=13.4;
   if(v.k>5)return{big:'Chưa bù kali',lab:'K > 5,0 mmol/L',tone:'caut',txt:'Kiểm tra lại K sau 2 giờ (sau khi bắt đầu insulin).'};
   if(v.k<3.5){const w=['Hoãn insulin đến K > 3,5.','Đường ngoại vi: nồng độ ≤ 40 mmol/L, tốc độ ≤ 10 mmol/giờ.'];return{big:'10 mmol/giờ',lab:'K < 3,5 – bù trước, CHƯA insulin',big2:'≈ '+fmt(10/amp*10,1)+' mL KCl 10%/giờ',lab2:'Quy đổi',tone:'dang',txt:'Ví dụ: 20 mmol (≈ 15 mL KCl 10%) trong 500 mL NaCl 0,9% truyền 2 giờ. Kiểm tra K mỗi giờ.',warn:w};}
   const vol=v.vol||1000,lo=20*vol/1000,hi=30*vol/1000,w=[];if(!v.cvc&&hi/vol*1000>40)w.push('Ngoại vi: không vượt 40 mmol/L.');
   return{big:fmt(lo,0)+'–'+fmt(hi,0)+' mmol',lab:'KCl thêm vào chai '+vol+' mL (20–30 mmol/L)',big2:fmt(lo/amp*10,0)+'–'+fmt(hi/amp*10,0)+' mL KCl 10% ('+fmt(lo/amp,1)+'–'+fmt(hi/amp,1)+' ống 10 mL)',lab2:'Quy đổi',tone:'prio',txt:'Mục tiêu K 4–5 mmol/L; kiểm tra K 2 giờ sau insulin rồi mỗi 4 giờ.',warn:w}}},
 osmtrend:{name:'Theo dõi tốc độ giảm (HHS): glucose – Na – áp lực thẩm thấu',src:'JBDS 2022 / đồng thuận 2024: áp lực thẩm thấu giảm 3–8 mOsm/kg/giờ; glucose ≤ 5 mmol/L/giờ (đồng thuận: 5–6,7); Na giảm ≤ 10 mmol/L/24 giờ. Áp lực thẩm thấu = 2Na + glucose + ure.',
  f:[{k:'h',l:'Khoảng thời gian giữa 2 lần đo (giờ)',t:'num',min:0.5,max:24},{k:'na1',l:'Na lần trước',t:'num',min:100,max:190},{k:'g1',l:'Glucose lần trước (mmol/L)',t:'num',min:1,max:150},{k:'u1',l:'Ure lần trước (mmol/L)',t:'num',min:0.5,max:80},{k:'na2',l:'Na hiện tại',t:'num',min:100,max:190},{k:'g2',l:'Glucose hiện tại (mmol/L)',t:'num',min:1,max:150},{k:'u2',l:'Ure hiện tại (mmol/L)',t:'num',min:0.5,max:80}],req:['h','na1','g1','u1','na2','g2','u2'],
  run(v){const o1=2*v.na1+v.g1+v.u1,o2=2*v.na2+v.g2+v.u2,ro=(o1-o2)/v.h,rg=(v.g1-v.g2)/v.h,rn=(v.na1-v.na2)/v.h*24,w=[];let tone='prio';
   if(ro>8){w.push('Áp lực thẩm thấu giảm > 8 mOsm/kg/giờ: QUÁ NHANH – giảm tốc độ dịch/insulin.');tone='dang';}else if(ro<3){w.push('Áp lực thẩm thấu giảm < 3/giờ (hoặc tăng): đánh giá lại bù dịch; nếu đủ dịch và glucose không giảm → insulin.');tone='caut';}
   if(rg>5){w.push('Glucose giảm > 5 mmol/L/giờ: QUÁ NHANH – thêm glucose 5–10%/giảm insulin.');tone='dang';}
   if(rn>10){w.push('Na giảm tương đương > 10 mmol/L/24 giờ: nguy cơ phù não/hủy myelin.');tone='dang';}
   if(v.na2>v.na1&&ro>0)w.push('Na tăng nhưng áp lực thẩm thấu giảm: chấp nhận được (glucose giảm).');
   return{big:fmt(ro,1)+' mOsm/kg/giờ',lab:'Tốc độ giảm áp lực thẩm thấu ('+fmt(o1,0)+' → '+fmt(o2,0)+')',big2:fmt(rg,1)+' mmol/L/giờ',lab2:'Tốc độ giảm glucose',tone,txt:'Na '+(rn>0?'giảm ':'tăng ')+fmt(Math.abs(rn),1)+' mmol/L quy đổi theo 24 giờ. Áp lực thẩm thấu hiện tại '+fmt(o2,0)+(o2<300?' (< 300: đạt một tiêu chuẩn hồi phục)':'')+'.',warn:w}}},
 gluc:{name:'Quy đổi glucose 10% – 20% – 30% – 50%',src:'Glucose x% = x g/100 mL. Hạ đường huyết người lớn: 15–20 g glucose TM (JBDS: glucose 10% 150–200 mL hoặc 20% 75–100 mL trong 15 phút).',
  f:[{k:'c',l:'Nồng độ',t:'sel',o:[['','— chọn —'],['10','Glucose 10%'],['20','Glucose 20%'],['30','Glucose 30%'],['50','Glucose 50%']]},{k:'g',l:'Số gam cần (g)',t:'num',min:1,max:100,presets:[['15','15 g'],['20','20 g'],['25','25 g']]},{k:'ml',l:'Hoặc thể tích có sẵn (mL)',t:'num',min:1,max:1000}],req:['c'],
  run(v){if(v.g==null&&v.ml==null)return{miss:['g']};const w=[];if(v.c>=30)w.push('Nồng độ ≥ 30%: rất ưu trương – tiêm chậm qua tĩnh mạch lớn, nguy cơ viêm/hoại tử khi thoát mạch; ưu tiên 10–20%.');
   const row=[[10,'150–200 mL'],[20,'75–100 mL'],[30,'50–67 mL (10–13 ống 5 mL)'],[50,'30–40 mL']].map(r=>r[0]+'%: '+r[1]).join(' · ');
   if(v.g!=null){const ml=v.g*100/v.c;return{big:fmt(ml,0)+' mL',lab:'Thể tích glucose '+v.c+'% cho '+fmt(v.g,0)+' g',tone:'spec',txt:(v.c===30?'= '+fmt(ml/5,1)+' ống 5 mL. ':'')+'Tham khảo 15–20 g: '+row+'.',warn:w};}
   return{big:fmt(v.ml*v.c/100,1)+' g',lab:fmt(v.ml,0)+' mL glucose '+v.c+'% chứa',tone:'spec',txt:'Tham khảo 15–20 g: '+row+'.',warn:w}}},
 bwps:{name:'Điểm Burch–Wartofsky (BWPS)',src:'Burch HB, Wartofsky L. 1993; ATA 2016: ≥ 45 gợi ý mạnh cơn bão giáp; 25–44 đe dọa; < 25 ít khả năng. Chỉ hỗ trợ – chẩn đoán lâm sàng.',
  f:[{k:'t',l:'Nhiệt độ (°C)',t:'sel',o:[['','— chọn —'],['0','< 37,2'],['5','37,2–37,7'],['10','37,8–38,2'],['15','38,3–38,8'],['20','38,9–39,3'],['25','39,4–39,9'],['30','≥ 40,0']]},
   {k:'cns',l:'Thần kinh trung ương',t:'sel',o:[['','— chọn —'],['0','Không'],['10','Nhẹ: kích động'],['20','Vừa: mê sảng, loạn thần, ngủ lịm'],['30','Nặng: co giật, hôn mê']]},
   {k:'gi',l:'Tiêu hóa – gan',t:'sel',o:[['','— chọn —'],['0','Không'],['10','Vừa: tiêu chảy, nôn, đau bụng'],['20','Nặng: vàng da không giải thích được']]},
   {k:'hr',l:'Nhịp tim (lần/phút)',t:'sel',o:[['','— chọn —'],['0','< 90'],['5','90–109'],['10','110–119'],['15','120–129'],['20','130–139'],['25','≥ 140']]},
   {k:'chf',l:'Suy tim',t:'sel',o:[['','— chọn —'],['0','Không'],['5','Nhẹ: phù chân'],['10','Vừa: ran ẩm hai đáy'],['15','Nặng: phù phổi']]},
   {k:'af',l:'Rung nhĩ',t:'ck'},{k:'pre',l:'Có yếu tố khởi phát',t:'ck'}],req:['t','cns','gi','hr','chf'],
  run(v){const s=v.t+v.cns+v.gi+v.hr+v.chf+(v.af?10:0)+(v.pre?10:0);return{big:s+' điểm',lab:'Burch–Wartofsky',tone:s>=45?'dang':s>=25?'caut':'prio',txt:s>=45?'≥ 45: gợi ý mạnh cơn bão giáp – điều trị ngay, ICU.':s>=25?'25–44: đe dọa cơn bão giáp – quyết định dựa vào lâm sàng, thường điều trị tích cực.':'< 25: ít khả năng cơn bão giáp.',warn:['Điểm có độ đặc hiệu thấp; không trì hoãn điều trị khi lâm sàng nghi ngờ.']}}},
 jta:{name:'Tiêu chuẩn Nhật Bản (JTA/JES) – cơn bão giáp',src:'Akamizu T et al. Thyroid 2012; JTA/JES 2016. Điều kiện bắt buộc: nhiễm độc giáp (FT3 và/hoặc FT4 tăng).',
  f:[{k:'tox',l:'Nhiễm độc giáp (FT3/FT4 tăng)',t:'ck'},{k:'cns',l:'Thần kinh: bồn chồn, mê sảng, loạn thần, ngủ lịm, hôn mê (GCS ≤ 14)',t:'ck'},{k:'fev',l:'Sốt ≥ 38 °C',t:'ck'},{k:'tac',l:'Nhịp tim ≥ 130 lần/phút (kể cả rung nhĩ)',t:'ck'},{k:'chf',l:'Suy tim: phù phổi, ran > 1/2 phế trường, sốc tim, NYHA IV/Killip ≥ III',t:'ck'},{k:'gi',l:'Tiêu hóa – gan: buồn nôn, nôn, tiêu chảy, bilirubin ≥ 51 µmol/L (3 mg/dL)',t:'ck'}],req:[],
  run(v){const o=[v.fev,v.tac,v.chf,v.gi].filter(Boolean).length;
   if(!v.tox)return{big:'Chưa đánh giá',lab:'Cần xác nhận nhiễm độc giáp',tone:'caut',txt:'Tiêu chuẩn chỉ áp dụng khi có nhiễm độc giáp. Nếu chưa có FT3/FT4 nhưng lâm sàng gợi ý (tiền sử Basedow, bướu giáp, lồi mắt) và đủ tiêu chí TS1 → xếp TS2 (nghi ngờ), điều trị như cơn bão giáp.'};
   if((v.cns&&o>=1)||o>=3)return{big:'TS1',lab:'Cơn bão giáp CHẮC CHẮN',tone:'dang',txt:(v.cns?'Nhiễm độc giáp + thần kinh + ≥ 1 tiêu chí khác.':'Nhiễm độc giáp + ≥ 3 tiêu chí ngoài thần kinh.')+' Điều trị ngay, ICU.'};
   if(o===2)return{big:'TS2',lab:'NGHI NGỜ cơn bão giáp',tone:'caut',txt:'Nhiễm độc giáp + 2 tiêu chí (sốt, nhịp nhanh, suy tim, tiêu hóa – gan). Điều trị như cơn bão giáp nếu lâm sàng phù hợp.'};
   return{big:'Không đủ',lab:'Chưa đủ tiêu chuẩn',tone:'prio',txt:'Theo dõi sát; đánh giá lại khi diễn tiến.'}}}
});
/* Công cụ tính Tiêu hóa – Gan mật (v2.4.0) */
const SEL=(k,l,o)=>({k,l,t:'sel',o:[['','— chọn —']].concat(o)});
const PPIS={1:['Esomeprazole',20],2:['Esomeprazole',40],3:['Omeprazole',20],4:['Pantoprazole',40],5:['Rabeprazole',20],6:['Lansoprazole',30]};
Object.assign(CALCS,{
 rockall:{name:'Rockall (XHTH trên)',src:'Rockall TA et al. Gut 1996. Rockall lâm sàng (trước nội soi, tối đa 7) và đầy đủ (sau nội soi, tối đa 11). Đầy đủ ≤ 2: nguy cơ thấp. Dự báo tử vong – không dùng đơn độc để quyết định điều trị.',
  f:[SEL('age','Tuổi',[['0','< 60'],['1','60–79'],['2','≥ 80']]),SEL('shock','Sốc',[['0','Không (mạch < 100, HATT ≥ 100)'],['1','Nhịp nhanh (mạch ≥ 100, HATT ≥ 100)'],['2','Tụt huyết áp (HATT < 100)']]),SEL('com','Bệnh kèm',[['0','Không bệnh nặng'],['2','Suy tim, bệnh mạch vành, bệnh nặng khác'],['3','Suy thận, suy gan, ung thư di căn']]),SEL('dx','Chẩn đoán nội soi (bỏ trống nếu chưa soi)',[['0','Mallory-Weiss / không tổn thương / không dấu chảy máu'],['1','Mọi chẩn đoán khác'],['2','Ung thư đường tiêu hóa trên']]),SEL('st','Dấu chảy máu gần đây',[['0','Không / đốm sẫm màu'],['2','Máu trong ống tiêu hóa trên, cục máu đông, mạch máu lộ, đang phun']])],req:['age','shock','com'],
  run(v){const c=v.age+v.shock+v.com;if(v.dx==null||v.st==null)return{big:c+' điểm',lab:'Rockall lâm sàng (trước nội soi)',tone:c===0?'prio':c>=4?'dang':'caut',txt:'Nhập kết quả nội soi để tính Rockall đầy đủ. Rockall lâm sàng 0: nguy cơ rất thấp.',warn:['Glasgow-Blatchford được ESGE/ACG ưu tiên trước nội soi.']};const t=c+v.dx+v.st;return{big:t+' điểm',lab:'Rockall đầy đủ (sau nội soi)',big2:c+' điểm',lab2:'Phần lâm sàng',tone:t<=2?'prio':t>=8?'dang':'caut',txt:t<=2?'≤ 2: nguy cơ chảy máu tái phát và tử vong thấp – cân nhắc ra viện sớm nếu lâm sàng cho phép.':t>=8?'≥ 8: nguy cơ tử vong cao.':'Nguy cơ trung bình.'}}},
 aims65:{name:'AIMS65 (tử vong XHTH trên)',src:'Saltzman JR et al. Gastrointest Endosc 2011. Mỗi tiêu chí 1 điểm; ≥ 2 điểm: nguy cơ tử vong tăng.',
  f:[{k:'alb',l:'Albumin < 30 g/L',t:'ck'},{k:'inr',l:'INR > 1,5',t:'ck'},{k:'ms',l:'Rối loạn ý thức (GCS < 14)',t:'ck'},{k:'sbp',l:'HATT ≤ 90 mmHg',t:'ck'},{k:'age',l:'Tuổi ≥ 65',t:'ck'}],req:[],
  run(v){const s=['alb','inr','ms','sbp','age'].filter(k=>v[k]).length;return{big:s+' điểm',lab:'AIMS65',tone:s>=2?'dang':'prio',txt:s>=2?'≥ 2: nguy cơ tử vong nội viện tăng – theo dõi sát, cân nhắc ICU.':'0–1: nguy cơ tử vong thấp.',warn:['Dự báo tử vong, không dự báo nhu cầu can thiệp.']}}},
 oakland:{name:'Oakland (XHTH dưới – an toàn ra viện)',src:'Oakland K et al. Lancet Gastroenterol Hepatol 2017; BSG 2019: ≤ 8 điểm có thể ra viện an toàn để khám ngoại trú. Ngưỡng ≤ 10 được đề xuất trong nghiên cứu xác nhận sau – chờ kiểm duyệt.',
  f:[{k:'age',l:'Tuổi',t:'num',min:16,max:110},SEL('sex','Giới',[['0','Nữ'],['1','Nam']]),{k:'prev',l:'Từng nhập viện vì XHTH dưới',t:'ck'},{k:'dre',l:'Thăm trực tràng có máu',t:'ck'},{k:'hr',l:'Nhịp tim (lần/phút)',t:'num',min:20,max:250},{k:'sbp',l:'HATT (mmHg)',t:'num',min:40,max:260},{k:'hb',l:'Hemoglobin (g/L)',t:'num',min:30,max:220}],req:['age','sex','hr','sbp','hb'],
  run(v){const a=v.age<40?0:v.age<70?1:2,hr=v.hr<70?0:v.hr<90?1:v.hr<110?2:3,sb=v.sbp<90?5:v.sbp<120?4:v.sbp<130?3:v.sbp<160?2:0,hb=v.hb<70?22:v.hb<90?17:v.hb<110?13:v.hb<130?8:v.hb<160?4:0,s=a+v.sex+(v.prev?1:0)+(v.dre?1:0)+hr+sb+hb;
   return{big:s+' điểm',lab:'Oakland',tone:s<=8?'prio':'caut',txt:'Tuổi '+a+' · giới '+v.sex+' · tiền sử '+(v.prev?1:0)+' · thăm trực tràng '+(v.dre?1:0)+' · nhịp '+hr+' · HATT '+sb+' · Hb '+hb+'. '+(s<=8?'≤ 8: có thể xuất viện, nội soi đại tràng ngoại trú (BSG 2019) nếu không yếu tố khác.':'> 8: nhập viện, theo dõi.'),warn:v.hb<36?['Hb < 36 g/L nằm ngoài khoảng xây dựng thang điểm.']:[]}}},
 marshall:{name:'Marshall cải biên (suy tạng – viêm tụy)',src:'Marshall JC 1995; Revised Atlanta 2012. ≥ 2 điểm ở bất kỳ cơ quan = suy tạng; > 48 giờ = suy tạng kéo dài (nặng).',
  f:[SEL('r','Hô hấp: PaO2/FiO2',[['0','> 400'],['1','301–400'],['2','201–300'],['3','101–200'],['4','≤ 101']]),SEL('k','Thận: creatinin (µmol/L)',[['0','< 134'],['1','134–169'],['2','170–310'],['3','311–439'],['4','> 439']]),SEL('c','Tim mạch: HATT (không vận mạch)',[['0','> 90'],['1','< 90, đáp ứng dịch'],['2','< 90, không đáp ứng dịch'],['3','< 90, pH < 7,3'],['4','< 90, pH < 7,2']])],req:['r','k','c'],
  run(v){const of=[['Hô hấp',v.r],['Thận',v.k],['Tim mạch',v.c]].filter(x=>x[1]>=2).map(x=>x[0]);return{big:of.length?'CÓ suy tạng':'Không suy tạng',lab:'Marshall: '+[v.r,v.k,v.c].join(' / '),tone:of.length?'dang':'prio',txt:of.length?'Suy: '+of.join(', ')+'. Kéo dài > 48 giờ = viêm tụy NẶNG; < 48 giờ = trung bình – nặng.':'Đánh giá lại hằng ngày trong 48–72 giờ đầu.',warn:of.length?['Cân nhắc ICU/đơn vị chăm sóc cao.']:[]}}},
 ctsi:{name:'Balthazar / CTSI',src:'Balthazar EJ et al. Radiology 1990. CT nên chụp sau 72–96 giờ khi cần đánh giá hoại tử.',
  f:[SEL('b','Balthazar',[['0','A – bình thường'],['1','B – tụy to'],['2','C – viêm quanh tụy'],['3','D – 1 ổ dịch'],['4','E – ≥ 2 ổ dịch hoặc khí']]),SEL('n','Hoại tử tụy',[['0','Không'],['2','≤ 30%'],['4','30–50%'],['6','> 50%']])],req:['b','n'],
  run(v){const s=v.b+v.n;return{big:s+' điểm',lab:'CTSI',tone:s>=7?'dang':s>=4?'caut':'prio',txt:s>=7?'7–10: nặng.':s>=4?'4–6: trung bình.':'0–3: nhẹ.'}}},
 fib4:{name:'FIB-4',src:'Sterling RK et al. Hepatology 2006. FIB-4 = tuổi × AST / (tiểu cầu × √ALT). < 1,3 loại trừ xơ hóa tiến triển (≥ 65 tuổi: < 2,0); > 2,67 nghi xơ hóa tiến triển. Không xác thực < 35 tuổi.',
  f:[{k:'age',l:'Tuổi',t:'num',min:18,max:100},{k:'ast',l:'AST (U/L)',t:'num',min:1,max:10000},{k:'alt',l:'ALT (U/L)',t:'num',min:1,max:10000},{k:'plt',l:'Tiểu cầu (G/L = ×10⁹/L)',t:'num',min:5,max:1500}],req:['age','ast','alt','plt'],
  run(v){const f=v.age*v.ast/(v.plt*Math.sqrt(v.alt)),lo=v.age>=65?2.0:1.3,w=[];if(v.age<35)w.push('Tuổi < 35: FIB-4 kém chính xác.');if(v.alt>5*40||v.ast>5*40)w.push('Viêm gan cấp/men gan rất cao: FIB-4 không đáng tin.');
   return{big:fmt(f,2),lab:'FIB-4',tone:f<lo?'prio':f>2.67?'dang':'caut',txt:f<lo?'Thấp: ít khả năng xơ hóa tiến triển.':f>2.67?'Cao: nghi xơ hóa tiến triển – đo độ đàn hồi gan, chuyển chuyên khoa.':'Vùng trung gian: đo độ đàn hồi gan.',warn:w}}},
 apri:{name:'APRI',src:'Wai CT et al. Hepatology 2003; WHO: APRI > 2 gợi ý xơ gan (người lớn); < 0,5 ít khả năng xơ hóa đáng kể.',
  f:[{k:'ast',l:'AST (U/L)',t:'num',min:1,max:10000},{k:'uln',l:'Giới hạn trên AST (U/L)',t:'num',min:20,max:60},{k:'plt',l:'Tiểu cầu (G/L)',t:'num',min:5,max:1500}],req:['ast','uln','plt'],
  run(v){const a=v.ast/v.uln/v.plt*100;return{big:fmt(a,2),lab:'APRI',tone:a>2?'dang':a>=0.5?'caut':'prio',txt:a>2?'> 2: gợi ý xơ gan (WHO).':a>=1.5?'≥ 1,5: nghi xơ hóa đáng kể.':a<0.5?'< 0,5: ít khả năng xơ hóa đáng kể.':'Trung gian – đo độ đàn hồi gan.'}}},
 egfr:{name:'eGFR CKD-EPI 2021 (không hệ số chủng tộc)',src:'Inker LA et al. N Engl J Med 2021. Không dùng khi creatinin chưa ổn định (tổn thương thận cấp). Xơ gan: creatinin đánh giá cao chức năng thận (khối cơ thấp).',
  f:[{k:'age',l:'Tuổi',t:'num',min:18,max:110},SEL('sex','Giới',[['1','Nữ'],['0','Nam']]),{k:'cr',l:'Creatinin (µmol/L)',t:'num',min:10,max:2500}],req:['age','sex','cr'],
  run(v){const s=v.cr/88.4,f=v.sex===1,k=f?0.7:0.9,a=f?-0.241:-0.302,e=142*Math.pow(Math.min(s/k,1),a)*Math.pow(Math.max(s/k,1),-1.2)*Math.pow(0.9938,v.age)*(f?1.012:1);
   return{big:fmt(e,0)+' mL/phút/1,73 m²',lab:'eGFR CKD-EPI 2021',tone:e<30?'dang':e<60?'caut':'prio',txt:'Creatinin '+fmt(s,2)+' mg/dL. Chỉnh liều thuốc thường dùng CrCl Cockcroft-Gault (công cụ CrCl).',warn:['Xơ gan, suy kiệt: eGFR/CrCl có thể đánh giá quá cao.']}}},
 saag:{name:'SAAG – phân tích dịch báng',src:'AASLD 2021: SAAG ≥ 11 g/L (1,1 g/dL) = tăng áp cửa. PMN ≥ 250/mm³ = SBP.',
  f:[{k:'sa',l:'Albumin máu (g/L)',t:'num',min:5,max:60},{k:'aa',l:'Albumin dịch báng (g/L)',t:'num',min:0,max:50},{k:'tp',l:'Protein toàn phần dịch (g/L) – tùy chọn',t:'num',min:0,max:80},{k:'pmn',l:'Bạch cầu đa nhân trung tính dịch (/mm³) – tùy chọn',t:'num',min:0,max:100000}],req:['sa','aa'],
  run(v){const g=v.sa-v.aa,w=[];let t=g>=11?'≥ 11 g/L: do TĂNG ÁP CỬA (xơ gan, suy tim, Budd–Chiari, di căn gan lớn).':'< 11 g/L: KHÔNG do tăng áp cửa (lao, ung thư phúc mạc, viêm tụy, thận hư).';
   if(v.tp!=null){if(g>=11&&v.tp>=25)t+=' Protein ≥ 25 g/L + SAAG cao: nghĩ suy tim/Budd–Chiari.';if(g>=11&&v.tp<15)w.push('Protein dịch < 15 g/L: nguy cơ SBP – cân nhắc dự phòng tiên phát.');}
   if(v.pmn!=null&&v.pmn>=250)w.unshift('PMN ≥ 250/mm³: VIÊM PHÚC MẠC NHIỄM KHUẨN – điều trị kháng sinh + albumin ngay; loại trừ viêm phúc mạc thứ phát.');
   return{big:fmt(g,1)+' g/L',lab:'SAAG',big2:fmt(g/10,2)+' g/dL',lab2:'Quy đổi',tone:v.pmn>=250?'dang':g>=11?'caut':'mon',txt:t,warn:w}}},
 albu:{name:'Liều albumin và số lọ',src:'AASLD 2021/EASL 2018: chọc tháo > 5 L → 6–8 g/L dịch tháo; SBP → 1,5 g/kg ngày 1 + 1 g/kg ngày 3 (Sort 1999); HRS-AKI → 20–40 g/ngày kèm co mạch (ADQI–ICA 2024); thử dịch khi thể tích chưa rõ → 1–1,5 g/kg albumin 20–25%.',
  f:[SEL('ind','Chỉ định',[['1','Chọc tháo dịch lượng lớn'],['2','SBP'],['3','HRS-AKI (kèm terlipressin)'],['4','Thử dịch khi AKI thể tích chưa rõ']]),{k:'l',l:'Thể tích dịch đã tháo (L)',t:'num',min:0.5,max:20},{k:'wt',l:'Cân nặng (kg)',t:'num',min:30,max:200},SEL('c','Nồng độ albumin',[['20','20%'],['25','25%'],['5','5%']]),{k:'vv',l:'Thể tích mỗi lọ (mL)',t:'num',min:10,max:500}],req:['ind','c','vv'],
  run(v){let lo,hi,txt,w=[];
   if(v.ind===1){if(v.l==null)return{miss:['l']};if(v.l<=5){return{big:'Không bắt buộc',lab:'Tháo ≤ 5 L',tone:'prio',txt:'AASLD 2021: albumin khi tháo > 5 L. Có nguy cơ AKI: cân nhắc 6–8 g/L.'};}lo=6*v.l;hi=8*v.l;txt='6–8 g × '+fmt(v.l,1)+' L dịch tháo.';}
   else{if(v.wt==null)return{miss:['wt']};
    if(v.ind===2){lo=hi=Math.min(1.5*v.wt,100);txt='Ngày 1: 1,5 g/kg'+(1.5*v.wt>100?' (giới hạn 100 g/ngày)':'')+'; NGÀY 3: '+fmt(Math.min(v.wt,100),0)+' g (1 g/kg).';}
    else if(v.ind===3){lo=20;hi=40;txt='20–40 g/ngày, chỉnh hằng ngày theo thể tích; ngừng khi quá tải.';}
    else{lo=Math.min(v.wt,100);hi=Math.min(1.5*v.wt,100);txt='1–1,5 g/kg albumin 20–25%, đánh giá lại sau 24 giờ (ADQI–ICA 2024).';}}
   const gv=v.c*v.vv/100,nl=Math.ceil(lo/gv),nh=Math.ceil(hi/gv);if(v.c===5)w.push('Albumin 5% thể tích lớn – thường dùng 20–25% trong xơ gan.');w.push('Theo dõi quá tải dịch (khó thở, ran phổi, SpO2).');
   return{big:fmt(lo,0)+(hi>lo?'–'+fmt(hi,0):'')+' g',lab:'Liều albumin',big2:nl+(nh>nl?'–'+nh:'')+' lọ',lab2:'Lọ '+v.c+'% × '+v.vv+' mL (= '+fmt(gv,1)+' g/lọ)',tone:'spec',txt,warn:w}}},
 ppiinf:{name:'Tốc độ truyền PPI liều cao',src:'Phác đồ kinh điển: 80 mg TM bolus, sau đó 8 mg/giờ × 72 giờ (ESGE, ACG). Thay thế: 40 mg TM ≥ 2 lần/ngày.',
  f:[SEL('d','Thuốc',[['1','Esomeprazole'],['2','Pantoprazole']]),{k:'mg',l:'Tổng lượng thuốc pha (mg)',t:'num',min:20,max:400},{k:'ml',l:'Thể tích pha cuối (mL)',t:'num',min:5,max:500},{k:'r',l:'Liều truyền (mg/giờ)',t:'num',min:1,max:16}],req:['d','mg','ml'],
  run(v){const c=v.mg/v.ml,r=v.r||8,mlh=r/c,dur=v.ml/mlh,w=[];if(dur>12)w.push('Một lần pha kéo dài '+fmt(dur,1)+' giờ > 12 giờ: pha lại mỗi 12 giờ (độ ổn định).');if(c>0.8)w.push('Nồng độ > 0,8 mg/mL: kiểm tra hướng dẫn pha của chế phẩm.');
   return{big:fmt(mlh,1)+' mL/giờ',lab:'Tốc độ bơm ('+fmt(r,0)+' mg/giờ)',big2:fmt(dur,1)+' giờ',lab2:'Thời gian dùng hết 1 lần pha',tone:'spec',txt:'Nồng độ '+fmt(c,2)+' mg/mL. Bolus 80 mg pha 100 mL NaCl 0,9% truyền 30 phút trước khi bắt đầu.',warn:w}}},
 hpsched:{name:'Lịch uống thuốc H. pylori và số viên',src:'Liều theo ACG 2024 (4 thuốc có bismuth tối ưu; vonoprazan + amoxicillin; rifabutin; phác đồ 3 thuốc khi biết nhạy). Kiểm tra lại liều với phác đồ đã chọn trong bài.',
  f:[SEL('reg','Phác đồ',[['1','4 thuốc có bismuth (PPI + bismuth + tetracyclin + metronidazol)'],['2','Vonoprazan + amoxicillin (kép)'],['3','Vonoprazan + amoxicillin + clarithromycin (chỉ khi nhạy)'],['4','Rifabutin (viên phối hợp omeprazole/amoxicillin/rifabutin)'],['5','PPI + amoxicillin + levofloxacin (chỉ khi nhạy)']]),SEL('ppi','PPI (phác đồ 1, 5)',[['1','Esomeprazole 20 mg'],['2','Esomeprazole 40 mg'],['3','Omeprazole 20 mg'],['4','Pantoprazole 40 mg'],['5','Rabeprazole 20 mg'],['6','Lansoprazole 30 mg']]),SEL('am','Hàm lượng amoxicillin',[['500','500 mg'],['1000','1000 mg']]),SEL('mt','Hàm lượng metronidazol',[['250','250 mg'],['500','500 mg']]),SEL('tt','Hàm lượng tetracyclin',[['250','250 mg'],['500','500 mg']]),{k:'days',l:'Số ngày',t:'num',min:7,max:14}],req:['reg'],
  run(v){const d=v.days||14,rows=[],w=[],R=(name,dose,str,slots,note)=>{const n=dose/str;if(n!==Math.round(n))w.push(name+': liều '+dose+' mg không chia hết hàm lượng '+str+' mg.');const per=Math.ceil(n),s=['S','T','C','Tố'].map(x=>slots.includes(x)?per+' viên':'—');rows.push([name+' '+dose+' mg'+(note?' ('+note+')':'')+' – tổng '+per*slots.length*d+' viên'].concat(s.map(x=>x.replace(' viên',''))));};
   if(v.reg===1||v.reg===5){if(v.ppi==null)return{miss:['ppi']};}
   const P=PPIS[v.ppi]||[];
   if(v.reg===1){if(v.mt==null||v.tt==null)return{miss:[v.mt==null?'mt':'tt']};R(P[0],P[1],P[1],['S','Tố'],'trước ăn 30 phút');R('Bismuth subcitrat',120,120,['S','T','C','Tố'],'trước ăn và trước ngủ');R('Tetracyclin',500,v.tt,['S','T','C','Tố'],'sau ăn, tránh sữa');R('Metronidazol',500,v.mt,['S','T','Tố'],'sau ăn; kiêng rượu');}
   else if(v.reg===2){if(v.am==null)return{miss:['am']};R('Vonoprazan',20,20,['S','Tố'],'');R('Amoxicillin',1000,v.am,['S','T','Tố'],'sau ăn');}
   else if(v.reg===3){if(v.am==null)return{miss:['am']};R('Vonoprazan',20,20,['S','Tố'],'');R('Amoxicillin',1000,v.am,['S','Tố'],'sau ăn');R('Clarithromycin',500,500,['S','Tố'],'sau ăn');w.push('Chỉ dùng khi đã xác định nhạy clarithromycin.');}
   else if(v.reg===4){rows.push(['Viên phối hợp (omeprazole 10 + amoxicillin 250 + rifabutin 12,5 mg) – tổng '+4*3*d+' viên','4','4','—','4']);w.push('Mỗi 8 giờ (cách đều), cùng bữa ăn. Theo dõi giảm bạch cầu; nước tiểu/nước mắt màu cam. Kiểm tra lưu hành.');}
   else if(v.reg===5){if(v.am==null)return{miss:['am']};R(P[0],P[1],P[1],['S','Tố'],'trước ăn 30 phút');R('Amoxicillin',1000,v.am,['S','Tố'],'sau ăn');R('Levofloxacin',500,500,['S'],'');w.push('Chỉ dùng khi đã xác định nhạy levofloxacin.');}
   w.push('Kiểm tra tiệt trừ ≥ 4 tuần sau điều trị; ngừng PPI/P-CAB ≥ 2 tuần trước xét nghiệm.');
   return{lab:'Lịch '+d+' ngày (S = sáng, T = trưa, C = chiều, Tố = tối/trước ngủ)',grid:{h:['Thuốc (số viên mỗi lần)','S','T','C','Tố'],rows},txt:'Tổng số viên đã tính cho '+d+' ngày. Uống đủ liệu trình kể cả khi hết triệu chứng.',warn:w}}}

/* Công cụ tính Thận – Điện giải (v2.5.0) */
const TBWF=(sex,age)=>sex===1?(age>=65?0.45:0.5):(age>=65?0.5:0.6);
Object.assign(CALCS,{
 upcr:{name:'UPCR / UACR – quy đổi và diễn giải',src:'KDIGO 2021/2024. Protein (hoặc albumin) mg/dL ÷ creatinin niệu mg/dL = g/g; 1 g/g ≈ 113 mg/mmol. UPCR (g/g) ≈ protein niệu g/24 giờ (ước tính, sai lệch khi khối cơ bất thường).',
  f:[SEL('ty','Loại',[['1','Protein niệu (UPCR)'],['2','Albumin niệu (UACR)']]),{k:'pu',l:'Protein/albumin niệu (mg/L)',t:'num',min:1,max:50000},{k:'cu',l:'Creatinin niệu (µmol/L)',t:'num',min:500,max:40000}],req:['ty','pu','cu'],
  run(v){const cr_g=v.cu*113.12/1e6,ratio=v.pu/1000/cr_g,mgmmol=v.pu/(v.cu/1000),w=[];
   if(v.ty===1){const tone=ratio>3.5?'dang':ratio>=0.3?'caut':'prio';return{big:fmt(ratio,2)+' g/g',lab:'UPCR',big2:fmt(mgmmol,0)+' mg/mmol',lab2:'Quy đổi',tone,txt:ratio>3.5?'> 3,5 g/g: protein niệu ngưỡng thận hư (≈ > 3,5 g/24 giờ).':ratio<0.3?'< 0,3 g/g: đạt tiêu chuẩn lui bệnh hoàn toàn (nếu đang theo dõi bệnh cầu thận).':'0,3–3,5 g/g: protein niệu có ý nghĩa.',warn:['Xác nhận bằng protein niệu 24 giờ khi quyết định điều trị ức chế miễn dịch.']};}
   const mgg=ratio*1000;return{big:fmt(mgg,0)+' mg/g',lab:'UACR',big2:fmt(mgmmol,1)+' mg/mmol',lab2:'Quy đổi',tone:mgg>300?'dang':mgg>=30?'caut':'prio',txt:mgg>300?'A3 (> 300 mg/g).':mgg>=30?'A2 (30–300 mg/g).':'A1 (< 30 mg/g).',warn:['Cần 2/3 mẫu bất thường trong 3–6 tháng để phân loại A.']};}},
 kfre:{name:'KFRE 4 biến (nguy cơ suy thận cần điều trị thay thế)',src:'Tangri N et al. JAMA 2016 (hệ số ngoài Bắc Mỹ). Dùng cho CKD G3–G5 (eGFR 10–60). KDIGO 2024: KFRE 5 năm 3–5% → chuyển chuyên khoa; 2 năm > 40% → chuẩn bị điều trị thay thế thận. Chờ kiểm duyệt hệ số hiệu chỉnh.',
  f:[{k:'age',l:'Tuổi',t:'num',min:18,max:100},SEL('sex','Giới',[['1','Nam'],['0','Nữ']]),{k:'egfr',l:'eGFR (mL/phút/1,73 m²)',t:'num',min:10,max:60},{k:'acr',l:'UACR (mg/g)',t:'num',min:1,max:25000}],req:['age','sex','egfr','acr'],
  run(v){const x=-0.2201*(v.age/10-7.036)+0.2467*(v.sex-0.5642)-0.5567*(v.egfr/5-7.222)+0.451*(Math.log(v.acr)-5.137),r2=1-Math.pow(0.9832,Math.exp(x)),r5=1-Math.pow(0.9365,Math.exp(x));
   return{big:fmt(r2*100,1)+'%',lab:'Nguy cơ 2 năm',big2:fmt(r5*100,1)+'%',lab2:'Nguy cơ 5 năm',tone:r2>0.4?'dang':r5>=0.03?'caut':'prio',txt:(r2>0.4?'2 năm > 40%: chuẩn bị điều trị thay thế thận (đường vào mạch máu, lọc màng bụng, ghép). ':'')+(r5>=0.03?'5 năm ≥ 3%: chuyển chuyên khoa thận.':'Nguy cơ thấp – theo dõi tại tuyến cơ sở.'),warn:['Không dùng khi AKI hoặc eGFR > 60 / < 10.']}}},
 bsa:{name:'Diện tích da (BSA – Mosteller)',src:'Mosteller RD. N Engl J Med 1987: BSA = √(cao cm × nặng kg / 3600). Dùng tính liều mg/m² (rituximab, cyclophosphamide) và quy đổi eGFR về mL/phút tuyệt đối.',
  f:[{k:'h',l:'Chiều cao (cm)',t:'num',min:100,max:230},{k:'wt',l:'Cân nặng (kg)',t:'num',min:25,max:250},{k:'egfr',l:'eGFR chuẩn hóa (mL/phút/1,73 m²) – tùy chọn',t:'num',min:2,max:200},{k:'mgm2',l:'Liều thuốc (mg/m²) – tùy chọn',t:'num',min:1,max:5000}],req:['h','wt'],
  run(v){const b=Math.sqrt(v.h*v.wt/3600),w=[];let txt='';if(v.egfr!=null)txt+='eGFR tuyệt đối (không chuẩn hóa) = '+fmt(v.egfr*b/1.73,0)+' mL/phút – dùng để chỉnh liều ở người rất to/nhỏ. ';if(v.mgm2!=null)txt+='Liều = '+fmt(v.mgm2*b,0)+' mg. ';
   return{big:fmt(b,2)+' m²',lab:'BSA',tone:'spec',txt:txt||'Nhập eGFR hoặc liều mg/m² để quy đổi.',warn:w}}},
 fena:{name:'FENa / FEUrea',src:'FENa = (Na niệu × Cr máu)/(Na máu × Cr niệu) × 100. < 1%: trước thận; > 2%: tại thận. FEUrea < 35% gợi ý trước thận khi đang dùng lợi tiểu. Kém tin cậy: CKD, nhiễm khuẩn huyết, thuốc cản quang, myoglobin, suy tim/xơ gan (FENa thấp dù tại thận).',
  f:[{k:'una',l:'Na niệu (mmol/L)',t:'num',min:1,max:300},{k:'pna',l:'Na máu (mmol/L)',t:'num',min:100,max:190},{k:'ucr',l:'Creatinin niệu (µmol/L)',t:'num',min:100,max:40000},{k:'pcr',l:'Creatinin máu (µmol/L)',t:'num',min:20,max:2500},{k:'uur',l:'Ure niệu (mmol/L) – tùy chọn',t:'num',min:10,max:1000},{k:'pur',l:'Ure máu (mmol/L) – tùy chọn',t:'num',min:1,max:100},{k:'diu',l:'Đang dùng lợi tiểu',t:'ck'}],req:['una','pna','ucr','pcr'],
  run(v){const fe=v.una*v.pcr/(v.pna*v.ucr)*100,w=[];let o={big:fmt(fe,2)+'%',lab:'FENa',tone:fe<1?'mon':fe>2?'caut':'supp',txt:fe<1?'< 1%: gợi ý trước thận (hoặc viêm cầu thận cấp, thuốc cản quang, myoglobin).':fe>2?'> 2%: gợi ý tổn thương tại thận (hoại tử ống thận cấp).':'1–2%: vùng không xác định.'};
   if(v.uur!=null&&v.pur!=null){const fu=v.uur*v.pcr/(v.pur*v.ucr)*100;o.big2=fmt(fu,1)+'%';o.lab2='FEUrea';o.txt+=' FEUrea '+(fu<35?'< 35%: trước thận.':fu>50?'> 50%: tại thận.':'35–50%: không xác định.');}
   if(v.diu)w.push('Đang dùng lợi tiểu: FENa không đáng tin – dùng FEUrea.');w.push('Chỉ diễn giải cùng lâm sàng và cặn nước tiểu; không dùng đơn độc để quyết định bù dịch.');o.warn=w;return o}},
 fwd:{name:'Thiếu hụt nước tự do (tăng Na) và dự kiến thay đổi Na theo dịch truyền',src:'Thiếu hụt = TBW × (Na/140 − 1). Adrogué–Madias: ΔNa sau 1 L dịch = (Na dịch + K dịch − Na máu)/(TBW + 1). TBW = 0,6/0,5 × cân nặng (nam/nữ), 0,5/0,45 khi ≥ 65 tuổi.',
  f:[{k:'na',l:'Na máu (mmol/L)',t:'num',min:100,max:200},{k:'wt',l:'Cân nặng (kg)',t:'num',min:20,max:250},{k:'age',l:'Tuổi',t:'num',min:16,max:110},SEL('sex','Giới',[['0','Nam'],['1','Nữ']]),SEL('fl','Dịch truyền',[['0','Glucose 5% (Na 0)'],['77','NaCl 0,45% (Na 77)'],['130','Ringer lactat (Na 130)'],['154','NaCl 0,9% (Na 154)'],['513','NaCl 3% (Na 513)']]),{k:'h',l:'Số giờ dự kiến điều chỉnh',t:'num',min:4,max:96}],req:['na','wt','age','sex'],
  run(v){const tbw=TBWF(v.sex,v.age)*v.wt,w=[];let o={tone:'spec'};
   if(v.na>145){const def=tbw*(v.na/140-1);o.big=fmt(def,1)+' L';o.lab='Thiếu hụt nước tự do';o.txt='TBW '+fmt(tbw,1)+' L. Mạn: giảm Na ≤ 10–12 mmol/L/24 giờ. Cộng thêm mất nước đang tiếp diễn.';}
   else{o.big='Na '+v.na;o.lab='Không tăng Na';o.txt='TBW '+fmt(tbw,1)+' L.';}
   if(v.fl!=null){const d=(v.fl-v.na)/(tbw+1);o.big2=(d>0?'+':'')+fmt(d,1)+' mmol/L';o.lab2='Thay đổi Na dự kiến sau 1 L dịch đã chọn';
    if(v.na>145&&d<0){const L1=Math.min(10,v.na-140)/(-d),hh=v.h||24;o.txt+=' Để giảm '+fmt(Math.min(10,v.na-140),0)+' mmol/L cần ≈ '+fmt(L1,1)+' L'+' → ≈ '+fmt(L1*1000/hh,0)+' mL/giờ trong '+hh+' giờ (chưa tính mất tiếp diễn).';}
    if(v.na<135&&d>0){const tgt=Math.min(8,140-v.na),L1=tgt/d;o.txt+=' Tăng '+tgt+' mmol/L cần ≈ '+fmt(L1*1000,0)+' mL dịch đã chọn.';w.push('Hạ Na: giới hạn ≤ 8–10 mmol/L/24 giờ; công thức thường đánh giá THẤP mức tăng (lợi niệu nước) – kiểm tra Na mỗi 2–4 giờ.');}}
   o.warn=w.concat(['Ước tính – xét nghiệm Na mỗi 2–4 giờ và điều chỉnh.']);return o}},
 acidbase:{name:'Toan – kiềm: anion gap hiệu chỉnh, Winter, delta, bù trừ',src:'AG = Na − (Cl + HCO3); AG hiệu chỉnh = AG + 0,25 × (40 − albumin g/L). Winter: PaCO2 = 1,5 × HCO3 + 8 ± 2. Kiềm chuyển hóa: PaCO2 = 0,7 × HCO3 + 21 ± 2. Hô hấp: cấp/mạn (Berend 2014). AG bình thường giả định 12 (khi albumin 40 g/L).',
  f:[{k:'ph',l:'pH',t:'num',min:6.5,max:7.9},{k:'pco2',l:'PaCO2 (mmHg)',t:'num',min:8,max:150},{k:'hco3',l:'HCO3 (mmol/L)',t:'num',min:1,max:60},{k:'na',l:'Na (mmol/L)',t:'num',min:100,max:190},{k:'cl',l:'Cl (mmol/L)',t:'num',min:60,max:150},{k:'alb',l:'Albumin (g/L)',t:'num',min:5,max:60}],req:['ph','pco2','hco3'],
  run(v){const w=[];let big,lab,txt='',tone='caut';
   if(v.ph<7.35){if(v.hco3<22){const lo=1.5*v.hco3+6,hi=1.5*v.hco3+10;big='Toan chuyển hóa';txt='PaCO2 dự kiến (Winter) '+fmt(lo,0)+'–'+fmt(hi,0)+' mmHg. '+(v.pco2>hi?'PaCO2 cao hơn → kèm TOAN HÔ HẤP. ':v.pco2<lo?'PaCO2 thấp hơn → kèm KIỀM HÔ HẤP. ':'Bù trừ hô hấp phù hợp. ');}
    else if(v.pco2>45){const d=(v.pco2-40)/10,ac=24+d,ch=24+3.5*d;big='Toan hô hấp';txt='HCO3 dự kiến: cấp '+fmt(ac,0)+', mạn '+fmt(ch,0)+' mmol/L. '+(v.hco3<ac-2?'HCO3 thấp hơn → kèm toan chuyển hóa. ':v.hco3>ch+2?'HCO3 cao hơn → kèm kiềm chuyển hóa. ':'');}else big='Toan máu – kiểm tra số liệu';tone='dang';}
   else if(v.ph>7.45){if(v.hco3>26){const e=0.7*v.hco3+21;big='Kiềm chuyển hóa';txt='PaCO2 dự kiến '+fmt(e-2,0)+'–'+fmt(e+2,0)+' mmHg. '+(v.pco2>e+2?'Cao hơn → kèm toan hô hấp. ':v.pco2<e-2?'Thấp hơn → kèm kiềm hô hấp. ':'');}
    else if(v.pco2<35){const d=(40-v.pco2)/10;big='Kiềm hô hấp';txt='HCO3 dự kiến: cấp '+fmt(24-2*d,0)+', mạn '+fmt(24-4.5*d,0)+' mmol/L. ';}else big='Kiềm máu – kiểm tra số liệu';}
   else{big='pH bình thường';txt='Có thể rối loạn phối hợp bù trừ nhau nếu HCO3/PaCO2 bất thường. ';tone='prio';}
   if(v.na!=null&&v.cl!=null){const ag=v.na-v.cl-v.hco3,agc=v.alb!=null?ag+0.25*(40-v.alb):ag;txt+='AG '+fmt(ag,0)+(v.alb!=null?', hiệu chỉnh albumin '+fmt(agc,1):'')+(agc>12?' (TĂNG).':' (bình thường).');
    if(agc>12){const dr=(agc-12)/(24-v.hco3);if(24-v.hco3>0)txt+=' Delta ratio '+fmt(dr,2)+(dr<1?': kèm toan AG bình thường.':dr>2?': kèm kiềm chuyển hóa.':': toan AG tăng đơn thuần.');}
    if(v.alb==null)w.push('Nhập albumin: albumin thấp che lấp AG tăng.');}
   return{big,lab:'Rối loạn chính',tone,txt,warn:w.concat(['Đối chiếu bệnh cảnh; khí máu động mạch cho PaCO2.'])}}},
 cacorr:{name:'Calci hiệu chỉnh theo albumin',src:'Ca hiệu chỉnh (mmol/L) = Ca + 0,02 × (40 − albumin g/L). Ưu tiên Ca ion hóa khi albumin rất thấp, toan – kiềm, CKD nặng.',
  f:[{k:'ca',l:'Calci toàn phần (mmol/L)',t:'num',min:0.8,max:5},{k:'alb',l:'Albumin (g/L)',t:'num',min:5,max:60}],req:['ca','alb'],
  run(v){const c=v.ca+0.02*(40-v.alb);return{big:fmt(c,2)+' mmol/L',lab:'Ca hiệu chỉnh',big2:fmt(c*4.008,1)+' mg/dL',lab2:'Quy đổi',tone:c>3.5||c<1.9?'dang':c>2.6||c<2.15?'caut':'prio',txt:c>3.5?'Tăng calci nặng.':c>3.0?'Tăng calci trung bình.':c>2.6?'Tăng calci nhẹ.':c<1.9?'Hạ calci nặng.':c<2.15?'Hạ calci.':'Bình thường.',warn:v.alb<25?['Albumin rất thấp: công thức kém chính xác – đo Ca ion hóa.']:[]}}},
 lyte:{name:'Tốc độ truyền điện giải (K, Mg, phosphat)',src:'Giới hạn: KCl ngoại vi ≤ 40 mmol/L và ≤ 10 mmol/giờ; trung tâm + monitor ≤ 20 mmol/giờ. MgSO4 1 g = 4 mmol. Phosphat TM ≤ 7,5 mmol/giờ (ngoại vi, tham khảo) – chờ kiểm duyệt. KCl 10%: 1 g/10 mL ≈ 13,4 mmol.',
  f:[SEL('ion','Điện giải',[['k','Kali clorid'],['mg','Magnesi sulfat'],['p','Phosphat']]),{k:'mmol',l:'Tổng lượng cần (mmol)',t:'num',min:1,max:200},{k:'vol',l:'Thể tích pha (mL)',t:'num',min:50,max:1000},{k:'h',l:'Thời gian truyền (giờ)',t:'num',min:0.25,max:24},{k:'cvc',l:'Đường truyền trung tâm + monitor',t:'ck'}],req:['ion','mmol','vol','h'],
  run(v){const rate=v.mmol/v.h,conc=v.mmol/v.vol*1000,mlh=v.vol/v.h,w=[];let tone='spec',extra='';
   if(v.ion==='k'){const lim=v.cvc?20:10;if(rate>lim){w.push('Tốc độ '+fmt(rate,1)+' mmol/giờ VƯỢT giới hạn '+lim+' mmol/giờ.');tone='dang';}if(!v.cvc&&conc>40){w.push('Nồng độ '+fmt(conc,0)+' mmol/L > 40 mmol/L – không dùng đường ngoại vi.');tone='dang';}extra='= '+fmt(v.mmol/13.4*10,1)+' mL KCl 10%.';}
   if(v.ion==='mg'){extra='= '+fmt(v.mmol/4,2)+' g MgSO4.';if(rate>8&&v.h>0.25)w.push('Tốc độ > 2 g/giờ: chỉ dùng trong cấp cứu (xoắn đỉnh), theo dõi huyết áp, phản xạ.');}
   if(v.ion==='p'){if(rate>7.5){w.push('Tốc độ phosphat > 7,5 mmol/giờ – nguy cơ hạ calci, lắng đọng (chờ kiểm duyệt).');tone='dang';}extra='Natri glycerophosphat: '+fmt(v.mmol,0)+' mL (1 mmol/mL).';}
   return{big:fmt(mlh,0)+' mL/giờ',lab:'Tốc độ bơm',big2:fmt(rate,1)+' mmol/giờ',lab2:'Tốc độ điện giải',tone,txt:'Nồng độ '+fmt(conc,0)+' mmol/L. '+extra,warn:w.concat(['Xét nghiệm lại sau khi truyền xong / mỗi 2–6 giờ.'])}}},
 hkins:{name:'Tăng kali: insulin – glucose và lịch theo dõi (UKKA)',src:'UKKA 2023 (cập nhật 07/2026): insulin regular 10 đơn vị + glucose 25 g TM trong 15 phút; glucose trước điều trị < 7 mmol/L → thêm glucose 10% 50 mL/giờ × 5 giờ. Theo dõi glucose 0–6 giờ.',
  f:[SEL('g','Dung dịch glucose cho liều 25 g',[['10','Glucose 10% (250 mL)'],['20','Glucose 20% (125 mL)'],['30','Glucose 30% (≈ 83 mL)'],['50','Glucose 50% (50 mL)']]),{k:'g0',l:'Glucose mao mạch trước điều trị (mmol/L)',t:'num',min:1,max:50},{k:'k',l:'Kali (mmol/L)',t:'num',min:5,max:10},{k:'t0',l:'Giờ bắt đầu (ví dụ 14.30)',t:'num',min:0,max:23.59}],req:['g','g0'],
  run(v){const vol=25*100/v.g,w=[];if(v.g>=30)w.push('Glucose ≥ 30% rất kích ứng tĩnh mạch – ưu tiên 10–20% (UKKA).');
   const low=v.g0<7;if(low)w.push('Glucose trước điều trị < 7 mmol/L: THÊM glucose 10% 50 mL/giờ × 5 giờ.');if(v.g0>=7&&v.g0<=8)w.push('Glucose 7–8: nguy cơ hạ glucose vẫn có – theo dõi sát.');
   const mins=[0,15,30,45,60,90,120,180,240,300,360];let times='';if(v.t0!=null){const h=Math.floor(v.t0),m=Math.round((v.t0-h)*100),s0=h*60+m;times=' Giờ kiểm tra glucose: '+mins.map(x=>{const t=(s0+x)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}).join(', ')+'.';}
   return{big:'10 đv + '+fmt(vol,0)+' mL',lab:'Insulin regular + glucose '+v.g+'% (25 g)',big2:fmt(vol*4,0)+' mL/giờ',lab2:'Tốc độ bơm glucose để truyền hết trong 15 phút',tone:'spec',txt:'Insulin 10 đơn vị pha vào chai/xy lanh glucose hoặc tiêm TM riêng cùng lúc. Glucose: trước, 15, 30, 45, 60, 90, 120 phút rồi mỗi giờ đến 6 giờ (12 giờ nếu suy thận nặng). Kali: 1, 2, 4, 6, 24 giờ.'+times,warn:w.concat(v.k>=6.5?['K ≥ 6,5: kèm salbutamol khí dung 10–20 mg, SZC; cân nhắc lọc máu.']:[])}}}

function calcHTML(id,open){const c=CALCS[id];
 const fld=f=>f.t==='ck'?'<label class="ck"><input type="checkbox" name="'+f.k+'">'+esc(f.l)+'</label>':f.t==='sel'?'<div class="fld"><label>'+esc(f.l)+'</label><select name="'+f.k+'">'+f.o.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select></div>':'<div class="fld"><label>'+esc(f.l)+'</label>'+(f.pm?'<div class="pmw"><button type="button" class="pmb" data-act="pm" data-k="'+f.k+'" data-d="-'+f.pm+'">−</button>':'')+'<input type="number" inputmode="decimal" step="'+(f.step||'any')+'" name="'+f.k+'">'+(f.pm?'<button type="button" class="pmb" data-act="pm" data-k="'+f.k+'" data-d="'+f.pm+'">+</button></div>':'')+'</div>';
 const pre=c.presets?'<div class="chips" style="margin-bottom:10px">'+c.presets.map((p,i)=>p.c.map((cc,j)=>'<button class="chip" style="min-height:36px;padding:4px 10px;font-size:13px" data-act="preset" data-c="'+id+'" data-i="'+i+'" data-j="'+j+'">'+esc(p.n)+' · '+esc(cc[2])+'</button>').join('')).join('')+'</div>':'';
 return'<details class="calc" data-calc="'+id+'"'+(open?' open':'')+'><summary>'+ic('i-calc','sm')+esc(c.name)+'<span class="r"></span></summary><div class="cb"><div>'+pre+'<div class="fgrid">'+c.f.map(fld).join('')+'</div>'+(c.note?'<p class="src" style="margin-top:8px">'+esc(c.note)+'</p>':'')+'</div><div class="res"><span class="lab">Kết quả</span><p class="empty">Nhập thông số để tính.</p></div><p class="src">Nguồn: '+esc(c.src)+'</p></div></details>';}
function runCalc(el){const id=el.dataset.calc,c=CALCS[id],v={},bad=[];
 for(const f of c.f){const inp=el.querySelector('[name="'+f.k+'"]');if(!inp)continue;
  if(f.t==='ck')v[f.k]=inp.checked;else if(inp.value==='')v[f.k]=null;else{const n=Number(inp.value);v[f.k]=isNaN(n)?inp.value:n;if(f.t==='num'&&(isNaN(n)||(f.min!=null&&n<f.min)||(f.max!=null&&n>f.max))){bad.push(f.l+' (khoảng hợp lý '+f.min+'–'+f.max+')');}}}
 const box=el.querySelector('.res'),sum=el.querySelector('summary .r');box.className='res';box.style.background='';
 if(bad.length){box.className='res t-dang';box.style.background='var(--tb)';box.innerHTML='<span class="lab">Dữ liệu không hợp lệ</span><p>'+bad.map(esc).join('<br>')+'</p>';sum.textContent='';return;}
 const miss=(c.req||[]).filter(k=>v[k]==null);if(miss.length){box.innerHTML='<span class="lab">Kết quả</span><p class="empty">Cần nhập: '+esc(miss.map(k=>c.f.find(f=>f.k===k).l).join(', '))+'. Không tự suy diễn thông số thiếu.</p>';sum.textContent='';return;}
 const r=c.run(v,el);if(r.miss){box.innerHTML='<span class="lab">Kết quả</span><p class="empty">Cần nhập: '+esc(r.miss.map(k=>c.f.find(f=>f.k===k).l).join(', '))+'.</p>';sum.textContent='';return;}
 if(r.grid){box.innerHTML='<span class="lab">'+esc(r.lab)+'</span><div style="overflow-x:auto"><table class="tbl"><thead><tr>'+r.grid.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.grid.rows.map(rw=>'<tr>'+rw.map((x,i)=>'<td'+(i?' style="text-align:center"':'')+'>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p>'+esc(r.txt||'')+'</p>'+(r.warn&&r.warn.length?'<ul class="wl">'+r.warn.map(w=>'<li>'+ic('i-alert','sm')+esc(w)+'</li>').join('')+'</ul>':'');sum.textContent=r.lab;return;}
 if(r.table){box.innerHTML='<span class="lab">Theo cân nặng '+esc(v.wt)+' kg</span><table class="tbl">'+r.table.map(x=>'<tr><td>'+esc(x[0])+'</td><td style="text-align:right;white-space:nowrap"><b>'+esc(x[1])+'</b></td></tr>').join('')+'</table>';sum.textContent=v.wt+' kg';return;}
 box.className='res t-'+r.tone;box.style.background='var(--tb)';
 box.innerHTML='<span class="lab">'+esc(r.lab)+'</span><span class="big" style="color:var(--tc)">'+esc(r.big)+'</span>'+(r.big2?'<span class="lab">'+esc(r.lab2)+'</span><span class="big" style="color:var(--tc);font-size:28px">'+esc(r.big2)+'</span>':'')+'<p>'+esc(r.txt)+'</p>'+(r.warn&&r.warn.length?'<ul class="wl">'+r.warn.map(w=>'<li>'+ic('i-alert','sm')+esc(w)+'</li>').join('')+'</ul>':'');sum.textContent=r.lab+': '+r.big;}

 if(!DB[cur]){$('#main').innerHTML=renderPlanned(it)+creditHTML();return;}
 const d=DB[cur],g=G(d.g),set=S(),fav=store.fav.includes(cur),nrv=d.regs.filter(r=>r.rv).length;
 let h='<section class="card hero"><nav class="crumb" aria-label="Vị trí"><button class="gb" data-act="group" data-id="'+g.id+'">'+ic(g.ic,'sm')+esc(g.name)+'</button>'+(subOf(cur)?'<span class="cs">›</span><span>'+esc(subOf(cur))+'</span>':'')+'<span class="cs">›</span><b>'+esc(d.name)+'</b></nav><h1>'+esc(d.name)+'</h1><p>'+esc(d.summary)+'</p><div class="hrow">'+
  '<div class="seg" role="group" aria-label="Chế độ đọc"><button class="'+(store.mode==='quick'?'on':'')+'" data-act="mode" data-id="quick">Đọc nhanh</button><button class="'+(store.mode==='deep'?'on':'')+'" data-act="mode" data-id="deep">Chuyên sâu</button></div>'+
  '<button class="ibtn fav'+(fav?' on':'')+'" data-act="fav">'+ic('i-star','sm')+(fav?'Đã yêu thích':'Yêu thích')+'</button>'+(navStack.length?'<button class="ibtn" data-act="back">'+ic('i-back','sm')+'Quay lại</button>':'')+
  '<button class="ibtn" data-act="copy">'+ic('i-copy','sm')+'Sao chép tất cả</button><button class="ibtn" data-act="print">'+ic('i-print','sm')+'In</button></div>'+
  '<div class="hrow"><span class="meta">'+ic('i-clock','sm')+'Kiểm tra cập nhật: '+CHECKED+'</span><button class="meta lnkb" data-act="view" data-id="refs">'+ic('i-book','sm')+d.refs.length+' nguồn guideline</button>'+(nrv?'<span class="meta" style="color:var(--caut)">'+ic('i-alert','sm')+nrv+' phác đồ chờ kiểm duyệt</span>':'')+'</div></section>';
 h+='<section class="card"><div class="sec-t">'+ic('i-target')+'Tình trạng lâm sàng <small>chọn nhiều mục; mục "chọn 1" tự loại trừ nhau</small><span class="sp"><button class="ibtn" data-act="reset">'+ic('i-reset','sm')+'Đặt lại</button></span></div>';
 const grs=[];let cg=null;for(const s of d.states){const lb=s.xl||s.gl;if(lb||!cg){cg={l:lb||'Tình trạng',items:[]};grs.push(cg);}cg.items.push(s);}
 for(const gr of grs)h+='<div class="cgrp"><span>'+esc(gr.l)+'</span><div class="chips">'+gr.items.map(s=>'<button class="chip'+(s.x?' rad':'')+(s.t?' t-'+s.t:'')+(set.has(s.id)?' on':'')+'" data-act="st" data-id="'+s.id+'" aria-pressed="'+set.has(s.id)+'"><span class="bx"></span>'+esc(s.l)+'</button>').join('')+'</div></div>';
 for(const n of needs(d))h+='<div class="need">'+ic('i-alert')+'<div><b>Cần bổ sung thông tin</b><p>'+esc(n.m)+'</p>'+(n.ask?'<div class="chips">'+n.ask.map(id=>{const s=stDef(d,id);return s?'<button class="chip'+(s.x?' rad':'')+'" data-act="st" data-id="'+id+'"><span class="bx"></span>'+esc(s.l)+'</button>':''}).join('')+'</div>':'')+'</div></div>';
 h+='</section>'+(d.tabs?'<nav class="etabs" aria-label="Cấp cứu">'+d.tabs.map(t=>'<button class="eb t-'+t[3]+(view==='t:'+t[0]?' on':'')+'" data-act="view" data-id="t:'+t[0]+'">'+ic(t[2],'sm')+t[1]+'</button>').join('')+'</nav>':'')+'<nav class="qa" aria-label="Chức năng">'+QA.filter(q=>qaAvail(d,q[0])).map(q=>{const n=qaCount(d,q[0]);return'<button class="qb'+(view===q[0]?' on':'')+'" style="--tc:var(--'+q[3]+')" data-act="view" data-id="'+q[0]+'">'+ic(q[2],'sm')+q[1]+(n?'<span class="n">'+n+'</span>':'')+'</button>';}).join('')+'</nav>';
 const V={drugs:viewDrugs,ci:viewCI,renal:viewRenal,hep:viewHep,admit:viewAdmit,fu:viewFU,flow:viewFlow,ov:viewOv,diff:viewDiff,special:viewSpecial,calc:viewCalc,refs:viewRefs};
 h+='<div class="view" id="view">'+(view.startsWith('t:')?viewTab(d,view.slice(2)):V[view]?V[view](d):viewRegs(d,view))+'</div>';
 h+='<div class="disc">'+ic('i-info','sm')+'<span>Công cụ hỗ trợ quyết định cho bác sĩ, không phải đơn thuốc tự động. Bác sĩ kiểm tra và lựa chọn trước khi sử dụng; đối chiếu tờ hướng dẫn, danh mục thuốc và quy trình bệnh viện. Mục "Chờ kiểm duyệt" chưa được xác thực đầy đủ. Không nhập thông tin định danh người bệnh.</span></div>'+creditHTML();
 $('#main').innerHTML=h;
 document.querySelectorAll('#view details.calc[open]').forEach(runCalc);renderTimer();renderBG();
 if(hlDrug){const e=document.getElementById('dg-'+hlDrug);if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'center'}),60);}}

/* ---------- panel hỗ trợ quyết định ---------- */
function renderRP(){const rp=$('#rp');if(!DB[cur]){rp.innerHTML='<div class="card"><h3>'+ic('i-info')+'Hỗ trợ quyết định</h3><p class="empty">Chọn một bài đã sẵn sàng.</p></div>';return;}
 const d=DB[cur],set=S(),a=activeRegs(d),u=x=>[...new Set(x)];
 const pri=a.filter(r=>['prio','spec','dang'].includes(r.t)).flatMap(r=>{const out=[];for(const it of r.lines||[]){if(it.or)out.push({or:it.or});else out.push(it);}return out;});
 const li=l=>{const x=DRUG[l.d]||{n:l.d};return'<li><button class="lnk" data-act="gotodrug" data-id="'+esc(l.d)+'">'+esc(x.n)+'</button> – '+esc(l.dose)+' · '+esc(l.freq)+'</li>';};
 let pl='';const seen=new Set();for(const it of pri){if(it.or){const nm=it.or.map(o=>Array.isArray(o)?o.map(x=>(DRUG[x.d]||{}).n).join(' + '):(DRUG[o.d]||{}).n).join(' / ');if(!seen.has(nm)){seen.add(nm);pl+='<li><b>Chọn 1:</b> '+esc(nm)+'</li>';}}else if(!seen.has(it.d+it.dose)){seen.add(it.d+it.dose);pl+=li(it);}}
 const bx=(t,ti,i,l)=>l?'<div class="rbox t-'+t+'"><h5>'+ic(i,'sm')+ti+'</h5><ul>'+l+'</ul></div>':'';const L=arr=>arr.length?arr.map(x=>'<li>'+esc(x)+'</li>').join(''):'';
 let h='<div class="card"><h3>'+ic('i-target')+'Hỗ trợ quyết định</h3>'+(set.size?'<div class="sel-sum">'+[...set].map(id=>'<span>'+esc((stDef(d,id)||{}).l||id)+'</span>').join('')+'</div>':'<p class="empty">Chưa chọn tình trạng – đang hiển thị phác đồ mặc định.</p>')+'</div><div class="card">';
 const nd=needs(d);if(nd.length)h+=bx('caut','Cần bổ sung','i-alert',L(nd.map(n=>n.m)));
 h+=bx('prio','Thuốc ưu tiên','i-pill',pl)+bx('dang','Cảnh báo','i-alert',L(u(a.flatMap(r=>r.warn||[]))))+bx('dang','Cần tránh','i-ban',L(u(a.flatMap(r=>r.avoid||[]))))+bx('mon','Theo dõi','i-pulse',L(u(a.flatMap(r=>r.mon||[]))))+bx('mon','Đánh giá lại','i-clock',L(u(a.map(r=>r.reval).filter(Boolean))))+bx('caut','Chuyển tuyến / hội chẩn','i-send',L(u(a.flatMap(r=>r.refer||[]))));
 rp.innerHTML=h+'</div>';}
function render(){renderGBar();renderSide();renderMain();renderRP();}

/* ---------- sao chép & in ---------- */
function regText(r){let t='== '+r.title+(r.rv?' [CHỜ KIỂM DUYỆT]':'')+' ==\n';if(r.ind)t+=r.ind+'\n';if(r.lines&&r.lines.length)t+=linesText(r.lines)+'\n';if(r.acts)t+=r.acts.map(a=>'• '+a).join('\n')+'\n';if(r.avoid)t+='Tránh: '+r.avoid.join('; ')+'\n';if(r.stop)t+='Giảm liều/ngừng: '+r.stop.join('; ')+'\n';if(r.reval)t+='Đánh giá lại: '+r.reval+'\n';if(r.src)t+='Nguồn: '+r.src.filter(k=>REFS[k]).map(k=>REFS[k].org+' '+REFS[k].y).join('; ')+'\n';return t;}
function protocolText(){const d=DB[cur],set=S();let t='PHÁC ĐỒ: '+d.name.toUpperCase()+'\nNgày tra cứu: '+new Date().toLocaleDateString('vi-VN')+'\nTình trạng: '+([...set].map(id=>(stDef(d,id)||{}).l).join('; ')||'(mặc định)')+'\n\n'+activeRegs(d).map(regText).join('\n');
 return t+'\nCông cụ hỗ trợ quyết định – bác sĩ kiểm tra trước khi sử dụng.\n'+CREDITS.join('\n');}
function copyText(t,msg){const done=()=>toast(msg||'Đã sao chép.');const fb=()=>{try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(ok)done();else showText(t);}catch(e){showText(t);}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();}catch(e){fb();}}
function showText(t){$('#mbox').innerHTML='<div class="mh"><h2>Sao chép thủ công</h2><button class="ibtn" data-act="mclose">Đóng</button></div><p class="empty">Trình duyệt chặn sao chép tự động. Chọn toàn bộ (Ctrl/⌘ + A) rồi sao chép.</p><textarea readonly>'+esc(t)+'</textarea>';$('#modal').classList.add('on');}
function printHTML(){const d=DB[cur],set=S();let h='<h1>'+esc(d.name)+'</h1><div class="pn">Ngày in: '+new Date().toLocaleDateString('vi-VN')+' · Tình trạng: '+esc([...set].map(id=>(stDef(d,id)||{}).l).join('; ')||'mặc định')+'</div>';
 for(const r of activeRegs(d)){h+='<h2>'+esc(r.title)+(r.rv?' [CHỜ KIỂM DUYỆT]':'')+'</h2>'+(r.ind?'<p>'+esc(r.ind)+'</p>':'');
  if(r.lines&&r.lines.length){h+='<table><tr><th>Thuốc</th><th>Liều</th><th>Đường</th><th>Số lần</th><th>Thời gian</th></tr>';for(const it of r.lines){const row=(x,m)=>'<tr><td>'+(m?'<i>'+m+'</i> ':'')+esc((DRUG[x.d]||{}).n)+'</td><td>'+esc(x.dose)+'</td><td>'+esc(x.route)+'</td><td>'+esc(x.freq)+'</td><td>'+esc(x.dur)+'</td></tr>';
   if(it.or){h+='<tr><td colspan="5"><b>Chọn MỘT:</b></td></tr>';it.or.forEach((o,i)=>{if(Array.isArray(o))o.forEach((x,j)=>h+=row(x,j?'+':(i?'HOẶC':'')));else h+=row(o,i?'HOẶC':'');});}else h+=row(it,'');}h+='</table>';}
  if(r.acts)h+='<ul>'+r.acts.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>';if(r.avoid)h+='<p><b>Tránh:</b> '+esc(r.avoid.join('; '))+'</p>';}
 h+='<h2>Tài liệu tham khảo</h2><ol>'+d.refs.map(k=>REFS[k]?'<li>'+esc(REFS[k].t)+(REFS[k].url?' – '+esc(REFS[k].url):'')+'</li>':'').join('')+'</ol><p class="pn">Công cụ hỗ trợ quyết định – bác sĩ kiểm tra trước khi sử dụng.</p><p class="pn" style="text-align:center"><b>'+CREDITS.map(esc).join('<br>')+'</b></p>';return h;}
function doPrint(){const h=printHTML();$('#printArea').innerHTML=h;$('#mbox').innerHTML='<div class="mh"><h2>Bản in</h2><button class="ibtn" data-act="doprint">'+ic('i-print','sm')+'In</button><button class="ibtn" data-act="mclose">Đóng</button></div><p class="empty">Nếu hộp thoại in không mở (khung xem chặn lệnh in), dùng Ctrl/⌘ + P hoặc mở tệp HTML trực tiếp.</p><div class="card" style="margin-top:10px">'+h+'</div>';$('#modal').classList.add('on');}

/* ---------- tìm kiếm ---------- */
const DRUG_IN={};for(const d of Object.values(DB))for(const k of drugKeys(d.regs))(DRUG_IN[k]=DRUG_IN[k]||[]).push(d.id);
function searchIdx(q){const n=norm(q).trim();if(!n)return[];const out=[];
 for(const it of ALL){const d=DB[it.id],hay=norm(it.name+' '+(d?d.keys:'')+' '+G(it.g).name);if(hay.includes(n))out[norm(it.name).includes(n)?'unshift':'push']({k:'d',id:it.id,l:it.name,s:DB[it.id]||ALIAS[it.id]?G(it.g).name:'Đang xây dựng',c:G(it.g).c});}
 for(const [k,x] of Object.entries(DRUG))if(DRUG_IN[k]&&norm(x.n+' '+(x.cls||'')).includes(n))for(const id of DRUG_IN[k].slice(0,3))out.push({k:'g',id,dk:k,l:x.n,s:'Thuốc · '+DB[id].name,c:G(DB[id].g).c});
 return out.slice(0,16);}
let sItems=[],sK=0;
function renderSearch(){const q=$('#q').value,b=$('#sres');sItems=searchIdx(q);sK=0;if(!q.trim()){b.classList.remove('on');return;}
 b.innerHTML=sItems.length?sItems.map((r,i)=>'<button class="'+(i===0?'k':'')+'" data-act="sgo" data-i="'+i+'"><span style="width:9px;height:9px;border-radius:50%;background:'+r.c+';flex:none"></span>'+(r.k==='g'?ic('i-pill','sm'):'')+esc(r.l)+'<em>'+esc(r.s)+'</em></button>').join(''):'<p class="empty" style="padding:10px">Không tìm thấy.</p>';b.classList.add('on');}
function sGo(i){const r=sItems[i];if(!r)return;$('#q').value='';$('#sres').classList.remove('on');if(r.k==='g')openDisease(r.id,{view:'drugs',drug:r.dk});else openDisease(r.id);}
function openTools(){$('#mbox').innerHTML='<div class="mh"><h2>Công cụ tính</h2><button class="ibtn" data-act="mclose">Đóng</button></div>'+Object.keys(CALCS).map(id=>calcHTML(id,false)).join('');$('#modal').classList.add('on');}

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='open')openDisease(id,{view:b.dataset.view||undefined});
 else if(a==='tsub'){closedSubs.has(id)?closedSubs.delete(id):closedSubs.add(id);renderSide();}
 else if(a==='group'){const f=ALL.find(x=>x.g===id&&DB[x.id])||ALL.find(x=>x.g===id);openGroups.add(id);openDisease(f.id);}
 else if(a==='tgl'){openGroups.has(id)?openGroups.delete(id):openGroups.add(id);renderSide();}
 else if(a==='st')toggleSt(id);
 else if(a==='reset'){sel[cur]=new Set();flows[cur]=null;toast('Đã đặt lại lựa chọn.');render();}
 else if(a==='view'){view=id;hlDrug=null;renderMain();}
 else if(a==='mode'){store.mode=id;save();renderMain();}
 else if(a==='gotodrug'){view='drugs';hlDrug=id;renderMain();}
 else if(a==='ref'){view='refs';renderMain();setTimeout(()=>{const el=document.getElementById('ref-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='var(--acc-bg)';}},60);}
 else if(a==='rcopy'){const r=DB[cur].regs.find(x=>x.id===id);copyText(DB[cur].name+'\n'+regText(r)+'\n'+CREDITS.join('\n'),'Đã sao chép phác đồ.');}
 else if(a==='dcopy'){const x=DRUG[id];copyText(x.n+' ('+x.f+')\nLiều: '+x.titr+'\nTối đa: '+(x.max||'—')+'\nThận: '+x.renal+'\nGan: '+x.hep+'\nCCĐ: '+x.ci,'Đã sao chép thuốc.');}
 else if(a==='copydrugs'){const ks=drugKeys(activeRegs(DB[cur]));copyText('THUỐC – '+DB[cur].name+'\n'+ks.map(k=>'• '+DRUG[k].n+': '+DRUG[k].titr).join('\n')+'\n'+CREDITS.join('\n'),'Đã sao chép.');}
 else if(a==='copy')copyText(protocolText(),'Đã sao chép toàn bộ phác đồ.');
 else if(a==='print')doPrint();
 else if(a==='doprint'){try{window.print();}catch(err){toast('Dùng Ctrl/⌘ + P.');}}
 else if(a==='fav'){store.fav=store.fav.includes(cur)?store.fav.filter(x=>x!==cur):[cur,...store.fav];save();render();}
 else if(a==='back'){const p=navStack.pop();if(p)openDisease(p.id||p,{back:1,view:p.view,y:p.y});}
 else if(a==='fopt'){const i=+b.dataset.i;flows[cur]=flows[cur].slice(0,i+1).concat(b.dataset.n);renderMain();const el=document.getElementById('fn-'+(i+1));if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
 else if(a==='fjump'){const el=document.getElementById('fn-'+b.dataset.i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
 else if(a==='freset'){flows[cur]=null;renderMain();}
 else if(a==='fapply'){const d=DB[cur],set=S(),n=[];for(const s of new Set(flows[cur].flatMap(x=>d.flow.n[x].set||[])))addSt(d,set,s,n);view='all';toast('Đã áp dụng lựa chọn từ sơ đồ.');render();}
 else if(a==='preset'){const c=CALCS[b.dataset.c],p=c.presets[+b.dataset.i],cc=p.c[+b.dataset.j],el=b.closest('details.calc');el._preset=p;
  const set=(k,v)=>{const inp=el.querySelector('[name="'+k+'"]');if(inp)inp.value=v;};if(b.dataset.c==='adr'){set('amp',cc[0]);set('vol',cc[1]);if(!el.querySelector('[name=dose]').value)set('dose','0.1');}else{set('amt',cc[0]);set('vol',cc[1]);set('u',p.u);set('du',p.du);set('dose',p.dose);}runCalc(el);toast(p.n+': '+cc[2]+(p.note?' – '+p.note:''));}
 else if(a==='pm'){const el=b.closest('details.calc'),inp=el.querySelector('[name="'+b.dataset.k+'"]');const v=Math.max(0.01,Math.round(((Number(inp.value)||0)+Number(b.dataset.d))*100)/100);inp.value=v;runCalc(el);}
 else if(a==='adrlog'){const d=Number($('#adrDose').value);adrLog.push({t:Date.now(),d});adrIntv=Number($('#adrInt').value);renderTimer();}
 else if(a==='adrundo'){adrLog.pop();renderTimer();}
 else if(a==='adrreset'){adrLog=[];renderTimer();}
 else if(a==='bglog'){const v=Number($('#bgVal').value);if(!$('#bgVal').value||!(v>=0.5&&v<=60)){toast('Nhập glucose hợp lệ 0,5–60 mmol/L');return;}bgIntv=Number($('#bgInt').value);bgLog.push({t:Date.now(),v,i:bgIntv});renderBG();}
 else if(a==='bgundo'){bgLog.pop();renderBG();}
 else if(a==='bgreset'){bgLog=[];renderBG();}
 else if(a==='tools')openTools();
 else if(a==='mclose')$('#modal').classList.remove('on');
 else if(a==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark';store.theme=r.dataset.theme;save();}
 else if(a==='menu'){$('#side').classList.toggle('on');$('#scrim').classList.toggle('on');}
 else if(a==='sgo')sGo(+b.dataset.i);
});
document.addEventListener('input',e=>{const c=e.target.closest('details.calc');if(c)runCalc(c);if(e.target.id==='q')renderSearch();});
document.addEventListener('change',e=>{const c=e.target.closest('details.calc');if(c)runCalc(c);});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.calc')&&e.target.open)runCalc(e.target);},true);
$('#q').addEventListener('keydown',e=>{const bs=[...document.querySelectorAll('#sres button')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;sK=(sK+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((x,i)=>x.classList.toggle('k',i===sK));}else if(e.key==='Enter'){e.preventDefault();sGo(sK);}else if(e.key==='Escape')$('#sres').classList.remove('on');});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').classList.remove('on');},true);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on');if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus();}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&ALL.some(x=>x.id===h))openDisease(h);});
if(store.theme)document.documentElement.dataset.theme=store.theme;
{const h=(location.hash||'').slice(1);openDisease(ALL.some(x=>x.id===h)?h:(store.hist[0]&&ALL.some(x=>x.id===store.hist[0])?store.hist[0]:'pud'));navStack=[];render();}
})();
</script>
